name: Nexus Autonomous Agent Pipeline

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Architecture directive'
        required: true
        default: 'Generate an interactive dashboard in a light premium style: creamy white background, soft warm borders, orange accents, rounded cards, clean typography. Standalone HTML with inline CSS.'
      mode:
        description: 'Execution context (full | code | research_only | fast)'
        required: true
        default: 'full'
  repository_dispatch:
    types: [nexus-task]

concurrency:
  group: nexus-agent-pipeline
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Nexus Swarm
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEXUS_GITHUB_TOKEN: ${{ secrets.NEXUS_GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            PROMPT='${{ github.event.client_payload.prompt }}'
            MODE='${{ github.event.client_payload.mode || 'full' }}'
          else
            PROMPT='${{ github.event.inputs.prompt }}'
            MODE='${{ github.event.inputs.mode }}'
          fi
          python src/agent.py --prompt "$PROMPT" --mode "$MODE"

      - name: Upload Execution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-output
          path: output/
          if-no-files-found: ignore

      - name: Commit Output and Recursive Memory Update
        run: |
          git config --global user.name "nexus-system"
          git config --global user.email "system@users.noreply.github.com"
          git add output/ config/lessons_learned.json
          git status
          # Commit only if there are changes, then push with conflict auto-resolution
          # (prefer the bot's own output files when a concurrent push collided).
          if ! git diff-index --quiet HEAD; then
            git commit -m "system: execution output and memory update [skip ci]"
          fi
          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            echo "[System] Push collision detected (attempt $attempt). Rebasing with bot-preference..."
            git pull --rebase --autostash -X theirs || git rebase --abort
          done
          git push || echo "[Warning] Final push failed; outputs remain in the run artifacts."
