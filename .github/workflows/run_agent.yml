name: Nexus Autonomous Agent Pipeline

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Architecture directive'
        required: true
        default: 'Generate an interactive dashboard structure utilizing strict dark mode aesthetics.'
      mode:
        description: 'Execution context'
        required: true
        default: 'full'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Resolve Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Nexus Swarm
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python src/agent.py --prompt "${{ github.event.inputs.prompt }}" --mode "${{ github.event.inputs.mode }}"

      - name: Commit Output and Recursive Memory Update
        run: |
          git config --global user.name "nexus-system"
          git config --global user.email "system@users.noreply.github.com"
          git add output/ config/lessons_learned.json
          git status
          git diff-index --quiet HEAD || git commit -m "system: execution output and memory update [skip ci]"
          git push
