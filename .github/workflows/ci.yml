name: Smoke Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'workspace/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v

      - name: UI Syntax Check
        run: |
          mkdir -p /tmp/uicheck && cd /tmp/uicheck
          npm init -y >/dev/null 2>&1
          npm i @babel/parser --no-audit --no-fund >/dev/null 2>&1
          cd $GITHUB_WORKSPACE
          node -e "
            const fs = require('fs');
            const parser = require('/tmp/uicheck/node_modules/@babel/parser');
            const html = fs.readFileSync('workspace/index.html', 'utf8');
            const m = html.match(/<script type=\"text\/babel\">([\s\S]*?)<\/script>/);
            if (!m) { console.error('NO BABEL SCRIPT FOUND'); process.exit(1); }
            try { parser.parse(m[1], { sourceType: 'script', plugins: ['jsx'] }); console.log('UI JSX parse OK (' + m[1].length + ' chars)'); }
            catch (e) { console.error('UI JSX PARSE FAILED: ' + e.message); process.exit(1); }
          "
