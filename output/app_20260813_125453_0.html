<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Creamy To‑Do List</title>
<style>
  :root {
    --bg-cream: #fdf6e3;
    --accent-orange: #ff9800;
    --accent-orange-dark: #e68900;
    --text-dark: #333;
    --border-radius: 6px;
    --shadow: 0 4px 12px rgba(0,0,0,.08);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background: var(--bg-cream);
    color: var(--text-dark);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding:2rem 0;
  }
  .todo-app {
    width: 100%;
    max-width: 420px;
    background:#fff;
    border-radius:var(--border-radius);
    box-shadow:var(--shadow);
    padding:1.5rem;
  }
  h1 {
    text-align:center;
    margin:0 0 1rem;
    color:var(--accent-orange);
    font-size:1.8rem;
    font-weight:600;
  }
  .input-group {
    display:flex;
    gap:.5rem;
    margin-bottom:1rem;
  }
  .input-group input {
    flex:1;
    padding:.6rem .9rem;
    border:1px solid #ccc;
    border-radius:var(--border-radius);
    font-size:1rem;
    transition:border-color .2s;
  }
  .input-group input:focus-visible {
    outline:none;
    border-color:var(--accent-orange);
  }
  .input-group button {
    padding:.6rem 1rem;
    background:var(--accent-orange);
    border:none;
    color:#fff;
    border-radius:var(--border-radius);
    cursor:pointer;
    font-weight:bold;
    transition:background .2s;
  }
  .input-group button:hover { background:var(--accent-orange-dark); }

  ul { list-style:none; padding:0; margin:0; }
  li {
    display:flex;
    align-items:center;
    gap:.5rem;
    padding:.6rem;
    border-bottom:1px solid #eee;
    transition:background .2s;
  }
  li:hover { background:#fafafa; }
  li.completed span { text-decoration:line-through; opacity:.6; }
  li span {
    flex:1;
    word-break:break-word;
  }
  .actions button {
    background:none;
    border:none;
    color:var(--accent-orange);
    cursor:pointer;
    font-size:1.2rem;
    line-height:1;
    padding:.2rem .4rem;
    border-radius:4px;
    transition:background .2s, color .2s;
  }
  .actions button:hover {
    background:rgba(255,152,0,.1);
    color:var(--accent-orange-dark);
  }

  .filters {
    display:flex;
    justify-content:center;
    gap:.5rem;
    margin:1rem 0;
    flex-wrap:wrap;
  }
  .filters button {
    background:none;
    border:none;
    color:var(--text-dark);
    cursor:pointer;
    font-weight:600;
    padding:.4rem .8rem;
    border-radius:20px;
    transition:background .2s, color .2s;
  }
  .filters button:hover {
    background:rgba(255,152,0,.1);
  }
  .filters button.active {
    background:var(--accent-orange);
    color:#fff;
  }

  .counter {
    text-align:center;
    font-size:.9rem;
    color:#555;
    margin-top:.5rem;
  }
</style>
</head>
<body>
<div class="todo-app">
  <h1>My To‑Do</h1>
  <div class="input-group">
    <input id="newTask" type="text" placeholder="What needs to be done?" autocomplete="off">
    <button id="addBtn">Add</button>
  </div>
  <ul id="taskList"></ul>
  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>
  <div class="counter" id="counter">0 items left</div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'creamTodoTasks';
  const taskListEl = document.getElementById('taskList');
  const newTaskInput = document.getElementById('newTask');
  const addBtn = document.getElementById('addBtn');
  const counterEl = document.getElementById('counter');
  const filterBtns = document.querySelectorAll('.filters button');

  let tasks = [];
  let currentFilter = 'all';

  // Load & Save --------------------------------------------------------------
  const loadTasks = () => {
    const data = localStorage.getItem(STORAGE_KEY);
    tasks = data ? JSON.parse(data) : [];
  };
  const saveTasks = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));

  // Rendering -----------------------------------------------------------------
  const render = () => {
    taskListEl.innerHTML = '';
    const filtered = tasks.filter(t => {
      if (currentFilter === 'active') return !t.completed;
      if (currentFilter === 'completed') return t.completed;
      return true;
    });

    filtered.forEach(task => {
      const li = document.createElement('li');
      li.className = task.completed ? 'completed' : '';
      li.dataset.id = task.id;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.completed;
      checkbox.addEventListener('change', toggleComplete);

      const span = document.createElement('span');
      span.textContent = task.text;

      const delBtn = document.createElement('button');
      delBtn.innerHTML = '&times;';
      delBtn.title = 'Delete';
      delBtn.addEventListener('click', deleteTask);

      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.appendChild(delBtn);

      li.append(checkbox, span, actions);
      taskListEl.appendChild(li);
    });

    updateCounter();
    updateFilterUI();
  };

  const updateCounter = () => {
    const activeCount = tasks.filter(t => !t.completed).length;
    counterEl.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;
  };

  const updateFilterUI = () => {
    filterBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === currentFilter);
    });
  };

  // CRUD ----------------------------------------------------------------------
  const addTask = () => {
    const text = newTaskInput.value.trim();
    if (!text) return;
    const task = { id: Date.now().toString(), text, completed: false };
    tasks.push(task);
    newTaskInput.value = '';
    saveTasks();
    render();
  };

  const toggleComplete = e => {
    const li = e.target.closest('li');
    const task = tasks.find(t => t.id === li.dataset.id);
    if (task) {
      task.completed = e.target.checked;
      saveTasks();
      render();
    }
  };

  const deleteTask = e => {
    const li = e.target.closest('li');
    tasks = tasks.filter(t => t.id !== li.dataset.id);
    saveTasks();
    render();
  };

  // Filtering -----------------------------------------------------------------
  const setFilter = filter => {
    currentFilter = filter;
    render();
  };

  // Event Listeners -----------------------------------------------------------
  addBtn.addEventListener('click', addTask);
  newTaskInput.addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
  filterBtns.forEach(btn => btn.addEventListener('click', () => setFilter(btn.dataset.filter)));

  // Init ----------------------------------------------------------------------
  loadTasks();
  render();
})();
</script>
</body>
</html>
