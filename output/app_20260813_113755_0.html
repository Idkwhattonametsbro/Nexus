<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Habit Tracker</title>
<style>
:root{
  --color-bg:#111827;      /* slate‑900 */
  --color-surface:#1e293b;/* slate‑800 */
  --color-text:#e2e8f0;    /* slate‑200 */
  --color-muted:#64748b;  /* slate‑500 */
  --color-accent:#6366f1; /* indigo‑500 */
  --color-accent-dark:#4f46e5;/* indigo‑600 */
}
[data-theme="light"]{
  --color-bg:#f5f5f5;      /* zinc‑100 */
  --color-surface:#e4e4e7;/* zinc‑200 */
  --color-text:#111827;   /* slate‑900 */
  --color-muted:#71717a;  /* zinc‑500 */
  --color-accent:#6366f1; /* indigo‑500 */
  --color-accent-dark:#4f46e5;/* indigo‑600 */
}
html,body{
  height:100%;
  margin:0;
  font-family:system-ui,Arial,sans-serif;
  background:var(--color-bg);
  color:var(--color-text);
}
#app{
  max-width:800px;
  margin:auto;
  padding:1rem;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:1rem;
}
h1{
  margin:0;
  font-size:1.5rem;
}
button{
  cursor:pointer;
  border:none;
  background:var(--color-accent);
  color:#fff;
  padding:.5rem 1rem;
  border-radius:.25rem;
  font-size:1rem;
}
button:hover{
  background:var(--color-accent-dark);
}
input[type=text]{
  padding:.5rem;
  border:1px solid var(--color-muted);
  border-radius:.25rem;
  background:var(--color-surface);
  color:var(--color-text);
  margin-right:.5rem;
}
input[type=checkbox]{
  width:1rem;
  height:1rem;
}
.habit{
  background:var(--color-surface);
  padding:.75rem;
  border-radius:.5rem;
  margin-bottom:.75rem;
}
.habit-name{
  font-weight:600;
  margin-bottom:.5rem;
}
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:.25rem;
  align-items:center;
}
.day-label{
  font-size:.75rem;
  text-align:center;
  color:var(--color-muted);
}
.progress{
  height:8px;
  background:var(--color-muted);
  border-radius:4px;
  overflow:hidden;
  margin-top:.5rem;
}
.progress div{
  height:100%;
  background:var(--color-accent);
}
.toggle{
  background:none;
  color:var(--color-text);
  font-size:1.25rem;
  padding:0;
}
.streak{
  font-size:.9rem;
  color:var(--color-muted);
  margin-right:.75rem;
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Habit Tracker</h1>
    <div>
      <span class="streak">Streak: <span id="streakCount">0</span> 🔥</span>
      <button class="toggle" id="themeToggle" aria-label="Toggle theme">🌓</button>
    </div>
  </header>

  <form id="addForm" autocomplete="off">
    <input type="text" id="habitInput" placeholder="New habit…" required>
    <button type="submit">Add</button>
  </form>

  <div id="habitsContainer"></div>
</div>

<script>
/* ---------- Constants & State ---------- */
const STORAGE_KEY = 'habit-tracker-data';
const THEME_KEY   = 'habit-tracker-theme';
let data = { habits: [] };

/* ---------- Persistence ---------- */
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ data = JSON.parse(raw); }
}

/* ---------- Theme ---------- */
function setTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  localStorage.setItem(THEME_KEY,theme);
}
function initTheme(){
  const stored = localStorage.getItem(THEME_KEY);
  setTheme(stored=== 'light' ? 'light' : 'dark');
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')||'dark';
  setTheme(cur==='dark'?'light':'dark');
}

/* ---------- Date Helpers ---------- */
function startOfWeek(date){
  const d = new Date(date);
  const day = d.getDay(); // 0 Sun … 6 Sat
  const diff = (day===0 ? -6 : 1 - day); // Monday as first day
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d;
}
function formatDate(d){ return d.toISOString().split('T')[0]; }
function getWeekDays(){
  const start = startOfWeek(new Date());
  return Array.from({length:7},(_,i)=>{ const d = new Date(start); d.setDate(start.getDate()+i); return d; });
}

/* ---------- Rendering ---------- */
function renderHabits(){
  const container = document.getElementById('habitsContainer');
  container.innerHTML = '';
  const weekDays = getWeekDays();

  data.habits.forEach(habit=>{
    const habitDiv = document.createElement('div');
    habitDiv.className = 'habit';
    habitDiv.dataset.id = habit.id;

    const nameDiv = document.createElement('div');
    nameDiv.className = 'habit-name';
    nameDiv.textContent = habit.name;
    habitDiv.appendChild(nameDiv);

    // Checkboxes for each day
    const daysDiv = document.createElement('div');
    daysDiv.className = 'days';
    weekDays.forEach(day=>{
      const dayKey = formatDate(day);
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = !!habit.days[dayKey];
      chk.dataset.habit = habit.id;
      chk.dataset.date  = dayKey;
      chk.addEventListener('change', onCheckChange);
      daysDiv.appendChild(chk);
    });
    habitDiv.appendChild(daysDiv);

    // Labels (Mon, Tue, …)
    const labelsDiv = document.createElement('div');
    labelsDiv.className = 'days';
    weekDays.forEach(day=>{
      const lbl = document.createElement('div');
      lbl.className = 'day-label';
      lbl.textContent = day.toLocaleDateString(undefined,{weekday:'short'});
      labelsDiv.appendChild(lbl);
    });
    habitDiv.appendChild(labelsDiv);

    // Weekly progress bar
    const completed = weekDays.filter(d=>habit.days[formatDate(d)]).length;
    const percent = Math.round(completed/7*100);
    const prog = document.createElement('div');
    prog.className = 'progress';
    const inner = document.createElement('div');
    inner.style.width = percent + '%';
    prog.appendChild(inner);
    habitDiv.appendChild(prog);

    container.appendChild(habitDiv);
  });

  updateStreak();
}

/* ---------- Event Handlers ---------- */
function onCheckChange(e){
  const habitId = e.target.dataset.habit;
  const dateKey = e.target.dataset.date;
  const habit = data.habits.find(h=>h.id===habitId);
  if(!habit) return;
  if(e.target.checked){
    habit.days[dateKey] = true;
  }else{
    delete habit.days[dateKey];
  }
  saveData();
  renderHabits();
}
function onAddHabit(e){
  e.preventDefault();
  const input = document.getElementById('habitInput');
  const name = input.value.trim();
  if(name){
    const id = crypto.randomUUID();
    data.habits.push({id, name, days:{}});
    input.value = '';
    saveData();
    renderHabits();
  }
}

/* ---------- Streak Counter ---------- */
function updateStreak(){
  const today = new Date();
  let streak = 0;
  // If there are no habits, streak is 0
  if(data.habits.length===0){
    document.getElementById('streakCount').textContent = '0';
    return;
  }
  while(true){
    const dayKey = formatDate(today);
    const allDone = data.habits.every(h=>h.days[dayKey]);
    if(!allDone) break;
    streak++;
    // Move to previous day
    today.setDate(today.getDate()-1);
  }
  document.getElementById('streakCount').textContent = streak;
}

/* ---------- Initialization ---------- */
document.getElementById('addForm').addEventListener('submit', onAddHabit);
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
loadData();
initTheme();
renderHabits();
</script>
</body>
</html>
