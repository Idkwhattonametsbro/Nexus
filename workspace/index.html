            const monacoLoaded = useRef(false);
            useEffect(() => {
                if (activeView !== 'files' || monacoLoaded.current) {
                    if (activeView === 'files' && editorRef.current) setTimeout(() => editorRef.current.layout(), 50);
                    return;
                }
                monacoLoaded.current = true;
                require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs' } });
                require(['vs/editor/editor.main'], function () {
                    monaco.editor.defineTheme('nexus-light', {
                        base: 'vs', inherit: true, rules: [],
                        colors: {
                            'editor.background': '#FAF8F4', 'editor.lineHighlightBackground': '#F3EEE6',
                            'editorLineNumber.foreground': '#C7C0B4', 'editorLineNumber.activeForeground': '#8A857C',
                            'editorCursor.foreground': '#F97316', 'editor.selectionBackground': '#FED7AA',
                            'editorIndentGuide.background': '#EAE3D6', 'editorIndentGuide.activeBackground': '#D6CFC2',
                            'minimap.background': '#FAF8F4',
                        },
                    });
                    editorRef.current = monaco.editor.create(document.getElementById('monaco-container'), {
                        value: '// Select a file from the workspace tree to inspect it.\n', language: 'plaintext',
                        theme: 'nexus-light', minimap: { enabled: false }, fontFamily: 'JetBrains Mono',
                        fontSize: 12, lineHeight: 19, padding: { top: 12 }, readOnly: true, scrollBeyondLastLine: false,
                    });
                });
            }, [activeView]);
            useEffect(() => { if (activeView === 'files' && editorRef.current) setTimeout(() => editorRef.current.layout(), 50); }, [activeView, openFile]);

            const openFileContent = (path) => {
                setOpenFile(path); setActiveView('files');
                fetch('https://raw.githubusercontent.com/' + REPO + '/main/' + path, { cache: 'no-store' })
                    .then(r => r.ok ? r.text() : Promise.reject()).then(txt => {
                        const lang = path.endsWith('.py') ? 'python' : path.endsWith('.html') ? 'html' : path.endsWith('.js') ? 'javascript' : path.endsWith('.json') ? 'json' : path.endsWith('.yml') || path.endsWith('.yaml') ? 'yaml' : path.endsWith('.css') ? 'css' : path.endsWith('.md') ? 'markdown' : 'plaintext';
                        if (editorRef.current) { monaco.editor.setModelLanguage(editorRef.current.getModel(), lang); editorRef.current.setValue(txt); }
                    }).catch(() => { if (editorRef.current) editorRef.current.setValue('// Failed to load ' + path); });
            };

            /* ================= AUTONOMY CORE ================= */
            const stopRef = useRef(false);
            const compressedRef = useRef({});
            const lastUserTextRef = useRef('');
            const autoContinueRef = useRef(true);

            // ---- Scheduler: fires due tasks/reminders every 20s ----
            useEffect(() => {
                const tick = () => {
                    const list = loadSchedules();
                    const now = Date.now();
                    const due = list.filter(x => x.enabled && x.nextAt <= now);
                    if (!due.length) return;
                    const remaining = list.filter(x => !due.includes(x));
                    due.forEach(x => {
                        if (x.kind !== 'timer') remaining.push({ ...x, nextAt: now + x.intervalMinutes * 60000, lastRun: now });
                        if (x.kind === 'reminder') {
                            pushMessage({ id: uid(), kind: 'card', title: 'REMINDER · ' + x.label.toUpperCase(), tone: 'warn', lines: [x.prompt], ts: stamp() });
                            notify('Nexus reminder', x.label + ': ' + x.prompt.slice(0, 120));
                        } else if (x.kind === 'timer') {
                            pushMessage({ id: uid(), kind: 'card', title: '⏱ TIMER · ' + x.label.toUpperCase(), tone: 'ok', lines: [x.prompt || 'Timer finished!'], ts: stamp() });
                            notify('Nexus timer', x.label + (x.prompt ? ': ' + x.prompt.slice(0, 100) : ''));
                            if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
                        } else {
                            pushMessage({ id: uid(), kind: 'card', title: 'SCHEDULED TASK · ' + x.label.toUpperCase(), tone: 'info', lines: ['Running scheduled task automatically...'], ts: stamp() });
                            notify('Nexus scheduled task', 'Running: ' + x.label);
                            agentTurn(x.prompt, []).catch(() => {});
                        }
                    });
                    saveSchedules(remaining);
                };
                const iv = setInterval(tick, 20000);
                return () => clearInterval(iv);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // ---- Context compression: when a chat grows past 46 messages,
            //      summarize the older ones so the agent stays sharp ----
            useEffect(() => {
                if (!activeChatId || busy) return;
                const mem = activeChat && activeChat.memory ? activeChat.memory : {};
                if (mem.summary || compressedRef.current[activeChatId]) return;
                if (!activeChat || activeChat.messages.length < 46) return;
                compressedRef.current[activeChatId] = true;
                (async () => {
                    try {
                        const oldMsgs = activeChat.messages.slice(0, -24).filter(x => x.text)
                            .map(x => (x.role === 'user' ? 'U: ' : 'A: ') + String(x.text).slice(0, 300)).join('\n').slice(0, 9000);
                        if (!oldMsgs) return;
                        const sum = await brainCall([{ role: 'user', content: 'Summarize this conversation in 4-6 short lines: goal, decisions made, files built, open questions, next steps. Plain text only.\n\n' + oldMsgs }], { temperature: 0.2 });
                        const txt = typeof sum === 'string' ? sum : JSON.stringify(sum);
                        setChats(prev => prev.map(c => c.id === activeChatId ? { ...c, memory: { ...(c.memory || {}), summary: txt.slice(0, 1200) } } : c));
                        pushMessage({ id: uid(), kind: 'card', title: 'CONTEXT COMPRESSED', tone: 'info', lines: ['Older messages summarized to keep this conversation sharp. Summary: ' + txt.slice(0, 150) + '...'], ts: stamp() });
                    } catch (e) {}
                })();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [activeChatId, activeChat ? activeChat.messages.length : 0]);

            /* ================= AGENT CORE ================= */
            const downloadBlob = (content, filename) => {
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                document.body.appendChild(a); a.click();
                setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
            };

            /* ---- file / image attachments ---- */
            const fileToDataUrl = (file) => new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result);
                r.onerror = () => reject(new Error('read failed'));
                r.readAsDataURL(file);
            });
            const downscaleImage = (dataUrl, max = 1024) => new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, max / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.max(1, Math.round(img.width * scale));
                    c.height = Math.max(1, Math.round(img.height * scale));
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    resolve(c.toDataURL('image/jpeg', 0.82));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
            const handleAttach = async (files) => {
                const added = [];
                for (const f of Array.from(files || [])) {
                    const base = { id: uid(), name: f.name };
                    if (f.type && f.type.startsWith('image/')) {
                        try {
                            const raw = await fileToDataUrl(f);
                            const dataUrl = await downscaleImage(raw);
                            added.push({ ...base, kind: 'image', dataUrl });
                        } catch (e) { added.push({ ...base, kind: 'file' }); }
                    } else if (f.type && f.type.startsWith('video/')) {
                        // Keep the File reference; uploaded to the repo in pipeline mode
                        added.push({ ...base, kind: 'video', file: f, size: f.size });
                    } else if (f.size < 200 * 1024) {
                        try { added.push({ ...base, kind: 'text', text: await f.text() }); }
                        catch (e) { added.push({ ...base, kind: 'file' }); }
                    } else {
                        added.push({ ...base, kind: 'file' });
                    }
                }
                setAttachments(prev => [...prev, ...added].slice(0, 6));
            };
            const uploadBlobToRepo = async (file, name) => {
                const token = remoteToken.trim();
                if (!token) throw new Error('No GitHub token for upload');
                const dataUrl = await fileToDataUrl(file);
                const base64 = dataUrl.split(',')[1];
                const path = 'chat-uploads/' + Date.now() + '_' + name.replace(/[^a-zA-Z0-9._-]/g, '_');
                const res = await fetch(API + '/contents/' + path, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'nexus: chat upload ' + name, content: base64 }),
                });
                if (!res.ok) throw new Error('Upload HTTP ' + res.status);
                return 'https://raw.githubusercontent.com/' + REPO + '/main/' + path;
            };
            const uploadImageToRepo = async (dataUrl, name) => {
                const token = remoteToken.trim();
                if (!token) throw new Error('No GitHub token for image upload');
                const path = 'chat-uploads/' + Date.now() + '_' + name.replace(/[^a-zA-Z0-9._-]/g, '_');
                const base64 = dataUrl.split(',')[1];
                const res = await fetch(API + '/contents/' + path, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'nexus: chat upload ' + name, content: base64 }),
                });
                if (!res.ok) throw new Error('Upload HTTP ' + res.status);
                return 'https://raw.githubusercontent.com/' + REPO + '/main/' + path;
            };
            const buildAttachmentPrompt = async (userText, atts) => {
                let prompt = userText;
                const textParts = [], imageUrls = [], videoUrls = [];
                for (const a of atts || []) {
                    if (a.kind === 'text') textParts.push('[Attached file: ' + a.name + ']\n```\n' + a.text.slice(0, 8000) + '\n```');
                    else if (a.kind === 'image') {
                        try { imageUrls.push(await uploadImageToRepo(a.dataUrl, a.name)); }
                        catch (e) { pushMessage({ id: uid(), kind: 'card', title: 'IMAGE UPLOAD FAILED', tone: 'error', lines: ['Could not upload ' + a.name + ' to the repo: ' + (e.message || e), 'Your GitHub token needs Contents read/write.'], ts: stamp() }); }
                    } else if (a.kind === 'video') {
                        try { videoUrls.push(await uploadBlobToRepo(a.file, a.name)); }
                        catch (e) { pushMessage({ id: uid(), kind: 'card', title: 'VIDEO UPLOAD FAILED', tone: 'error', lines: ['Could not upload ' + a.name + ': ' + (e.message || e)], ts: stamp() }); }
                    }
                }
                if (textParts.length) prompt += '\n\n' + textParts.join('\n\n');
                if (imageUrls.length) prompt += '\n\n' + imageUrls.map(u => '[IMAGE_URL: ' + u + ']').join('\n');
                if (videoUrls.length) prompt += '\n\nAttached video(s):\n' + videoUrls.map(u => '- [VIDEO_URL: ' + u + ']').join('\n') + '\n(The video is stored in the repo; the model cannot watch it directly - describe what you want done with it.)';
                return prompt;
            };

            const exportChat = () => {
                const lines = messages.map(m => {
                    if (m.kind === 'thought') return '## Thought (' + m.secs + 's)\n' + (m.lines || []).map(l => '- ' + l).join('\n');
                    if (m.kind === 'card') return '## [' + m.title + ']\n' + (m.lines || []).join('\n');
                    if (m.kind === 'artifact') return '## Artifact: ' + m.filename + ' (iterations ' + (m.iterations || 1) + ')\n```html\n' + (m.content || '').slice(0, 4000) + '\n```';
                    if (m.role === 'user') return '## You (' + m.ts + ')\n' + m.text;
                    return '## Nexus (' + m.ts + ')\n' + (m.text || '');
                }).join('\n\n---\n\n');
                downloadBlob('# Nexus Session Export\n\n' + lines, 'nexus-chat-' + Date.now() + '.md');
            };

            const saveToRepo = async (filename, content) => {
                const token = remoteToken.trim() || (loadBrain().githubToken || '');
                if (!token) throw new Error('No GitHub token. Open REMOTE and paste a fine-grained token (Contents read/write).');
                const path = 'chat-outputs/' + filename;
                let sha = null;
                try {
                    const g = await fetch(API + '/contents/' + path, { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
                    if (g.ok) sha = (await g.json()).sha;
                } catch (e) {}
                const res = await fetch(API + '/contents/' + path, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'nexus: chat artifact ' + filename, content: btoa(unescape(encodeURIComponent(content))), sha }),
                });
                if (!res.ok) throw new Error('GitHub ' + res.status);
                return 'https://github.com/' + REPO + '/blob/main/' + path;
            };

            const runReviewLoop = async (artId, directive, artifact) => {
                let current = artifact;
                for (let i = 0; i < 3; i++) {
                    // Ground-truth sandbox test FIRST (real checks, not just opinion)
                    let sandbox = null;
                    if (/(\.html?$)|^html$/i.test(current.filename || '') || /<html/i.test(current.content || '')) {
                        sandbox = testHtml(current.content || '');
                        updateMessage(artId, { sandbox });
                        pushMessage({ id: uid(), kind: 'card', title: 'SANDBOX TEST', tone: sandbox === 'PASS' ? 'ok' : 'warn', lines: [String(sandbox)], ts: stamp() });
                    }
                    pushMessage({ id: uid(), kind: 'card', title: 'REVIEW PASS ' + (i + 1), tone: 'info', lines: ['Critiquing artifact against directive...'], ts: stamp() });
                    let rev;
                    try {
                        rev = await brainCall([
                            { role: 'system', content: REVIEW_SYSTEM },
                            { role: 'user', content: 'SANDBOX TEST RESULT:\n' + (sandbox || 'not run') + '\n\nDIRECTIVE:\n' + directive + '\n\nARTIFACT:\n' + current.content },
                        ], { jsonMode: true, temperature: 0.2 });
                    } catch (e) {
                        pushMessage({ id: uid(), kind: 'card', title: 'REVIEW ERROR', tone: 'error', lines: [String(e.message || e)], ts: stamp() });
                        return;
                    }
                    const score = Math.max(1, Math.min(10, Math.round(Number(rev.score) || (rev.decision === 'approve' ? 9 : 5))));
                    if (rev.decision === 'approve' && score >= 8) {
                        updateMessage(artId, { review: { decision: 'approve', issues: [], score } });
                        pushMessage({ id: uid(), kind: 'card', title: 'REVIEW APPROVED · ' + score + '/10', tone: 'ok', lines: ['Artifact passed the quality review.'], ts: stamp() });
                        return;
                    }
                    if (i === 2) {
                        updateMessage(artId, { review: { decision: 'approve', issues: [], score } });
                        pushMessage({ id: uid(), kind: 'card', title: 'REVIEW · ' + score + '/10 (MAX ITERATIONS)', tone: 'ok', lines: ['Reached 3 fix rounds. Delivering the best version.'], ts: stamp() });
                        return;
                    }
                    const issues = (rev.issues || []).slice(0, 5);
                    updateMessage(artId, { review: { decision: 'fix', issues } });
                    pushMessage({ id: uid(), kind: 'card', title: 'REVIEW FOUND ISSUES', tone: 'warn', lines: issues.length ? issues.map(s => '• ' + s) : ['• Unspecified quality issues'], ts: stamp() });
                    const improved = rev.improved && rev.improved.content;
                    if (!improved) {
                        pushMessage({ id: uid(), kind: 'card', title: 'FIX NOT PROVIDED', tone: 'warn', lines: ['Review requested fixes but returned no improved artifact. Delivering as-is.'], ts: stamp() });
                        return;
                    }
                    current = { filename: (rev.improved.filename || current.filename), language: current.language, content: improved };
                    updateMessage(artId, { content: improved, filename: current.filename, iterations: (i + 2) });
                    pushMessage({ id: uid(), kind: 'card', title: 'ITERATION ' + (i + 2) + ' APPLIED', tone: 'info', lines: ['Improved artifact generated from review feedback.'], ts: stamp() });
                }
                pushMessage({ id: uid(), kind: 'card', title: 'MAX ITERATIONS (3)', tone: 'warn', lines: ['Loop limit reached. Delivering the artifact as-is.'], ts: stamp() });
            };

            const maybeLearnLesson = async (directive, content) => {
                try {
                    const out = await brainCall([
                        { role: 'system', content: LESSON_SYSTEM },
                        { role: 'user', content: 'TASK:\n' + directive + '\n\nARTIFACT SNIPPET:\n' + content.slice(0, 1500) },
                    ], { jsonMode: true, temperature: 0.1 });
                    if (out && out.lesson) {
                        addLesson(out.lesson);
                        pushMessage({ id: uid(), kind: 'card', title: 'MEMORY UPDATED', tone: 'ok', lines: ['Learned: ' + out.lesson], ts: stamp() });
                    }
                } catch (e) {}
            };

            /* Pipeline brain: uses the GitHub Actions secrets in the background.
               The chat dispatches a run and streams the result back. No keys in the browser. */
            const fetchRunLog = async (runId, token) => {
                try {
                    const j = await fetch(API + '/actions/runs/' + runId + '/jobs', { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
                    const jd = await j.json();
                    const job = jd.jobs && jd.jobs[0];
                    if (!job) return [];
                    const lg = await fetch(API + '/actions/jobs/' + job.id + '/logs', { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
                    const txt = await lg.text();
                    return txt.split('\n').filter(l => l.includes('[System]') || l.includes('[Route]') || l.includes('[Warning]')).map(l => l.replace(/^.*?Z /, '').replace(/^\d{4}-\d{2}-\d{2}T[\d:.]*Z /, '').trim()).filter(Boolean).slice(-10);
                } catch (e) { return []; }
            };

            const extractReportReply = (txt) => {
                const idx = txt.indexOf('\n---\n');
                const body = idx >= 0 ? txt.slice(idx + 5) : txt;
                return body.trim();
            };

            const pipelineTurn = async (userText, atts) => {
                const prompt = await buildAttachmentPrompt(userText, atts);
                const token = remoteToken.trim();
                if (!token) {
                    pushMessage({ id: uid(), kind: 'card', title: 'ONE-TIME SETUP NEEDED', tone: 'warn', lines: ['Nexus thinks through the background pipeline so your API keys stay in GitHub secrets.', 'Open PIPELINE and paste your GitHub token once (fine-grained, Actions read/write). It is stored only in this browser.', 'No API keys are ever entered in the chat.'], ts: stamp() });
                    setShowRemote(true);
                    return;
                }
                setBusy(true);
                setProviderTag('PIPELINE');
                const thoughtId = uid();
                const started = Date.now();
                pushMessage({ id: thoughtId, kind: 'thought', secs: '...', lines: ['Dispatching to background pipeline (uses your GitHub secrets)...'], ts: stamp() });
                try {
                    const res = await fetch(API + '/actions/workflows/run_agent.yml/dispatches', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ref: 'main', inputs: { prompt, mode: 'chat' } }),
                    });
                    if (!res.ok) throw new Error('Dispatch HTTP ' + res.status);
                    let run = null;
                    for (let i = 0; i < 45; i++) {
                        await new Promise(r => setTimeout(r, 6000));
                        const rr = await fetch(API + '/actions/runs?event=workflow_dispatch&per_page=1', { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
                        const dd = await rr.json();
                        if (dd.workflow_runs && dd.workflow_runs.length) {
                            run = dd.workflow_runs[0];
                            const elapsed = Math.round((Date.now() - started) / 1000);
                            updateMessage(thoughtId, { lines: ['Pipeline run #' + run.run_number + ' in progress (' + elapsed + 's)...', 'Agent is thinking with your GitHub secrets.', 'This message will update when the run completes.'] });
                            if (run.status !== 'queued' && run.status !== 'in_progress') break;
                        }
                    }
                    if (!run) throw new Error('Timed out waiting for the pipeline run.');
                    const secs = ((Date.now() - started) / 1000).toFixed(1);
                    if (run.conclusion !== 'success') {
                        updateMessage(thoughtId, { secs, lines: ['Pipeline run #' + run.run_number + ' ' + (run.conclusion || 'failed') + '.', 'Check the run log for details.'] });
                        pushMessage({ id: uid(), kind: 'card', title: 'RUN ' + (run.conclusion || 'FAILED').toUpperCase(), tone: 'error', lines: ['Run #' + run.run_number + ' did not complete successfully. Open the run log to inspect.', run.html_url], ts: stamp() });
                        return;
                    }
                    const logLines = await fetchRunLog(run.id, token);
                    updateMessage(thoughtId, { secs, lines: logLines.length ? logLines : ['Pipeline run #' + run.run_number + ' completed successfully.'] });
                    setProviderTag('PIPELINE');
                    const rep = await fetch(PAGES_ROOT + '/output/latest_report.md', { cache: 'no-store' });
                    if (rep.ok) {
                        const reply = extractReportReply(await rep.text());
                        pushMessage({ id: uid(), role: 'agent', text: reply, ts: stamp() });
                    }
                    const man = await fetch(PAGES_ROOT + '/output/latest_manifest.json', { cache: 'no-store' });
                    if (man.ok) {
                        const m = await man.json();
                        const art = await fetch(PAGES_ROOT + '/output/latest_app.html', { cache: 'no-store' });
                        if (art.ok) {
                            const content = await art.text();
                            if (content && content.length > 20) {
                                pushMessage({ id: uid(), kind: 'artifact', filename: 'app_' + (m.timestamp || Date.now()) + '.html', lang: 'HTML', content, summary: m.provider + ' · ' + m.model + ' · ' + m.latency_ms + 'ms' + (m.review && m.review.applied ? ' · REVIEWED' : ''), iterations: [1], review: null, ts: stamp() });
                                setPreviewHtml(content);
                            }
                        }
                    }
                    setMemoryEpoch(e => e + 1);
                } catch (err) {
                    updateMessage(thoughtId, { secs: '0.0', lines: ['Pipeline call failed.'] });
                    pushMessage({ id: uid(), kind: 'card', title: 'PIPELINE ERROR', tone: 'error', lines: [String(err.message || err)], ts: stamp() });
                } finally {
                    setBusy(false);
                    setProviderTag('--');
                }
            };

            /* Hybrid routing: chat brain (Puter / keyed provider) for conversation,
               GitHub pipeline for heavy builds when it makes sense. */
            const isHeavyBuild = (t) => {
                const words = (t || '').trim().split(/\s+/).length;
                return words > 60 || /repo|repository|project|docker|database|backend|full-stack|saas|multi-file|architecture/i.test(t);
            };
            const chatProvider = () => { const c = loadBrain(); return (c.provider && PROVIDER_DEFS[c.provider]) ? c.provider : 'groq'; };

            const agentTurn = async (userText, atts) => {
                const usePuter = chatProvider() === 'puter';
                const heavy = isHeavyBuild(userText);
                if (!brainConfigured()) { await pipelineTurn(userText, atts); return; }
                if (usePuter && heavy && remoteToken.trim()) {
                    pushMessage({ id: uid(), kind: 'card', title: 'HEAVY BUILD → PIPELINE', tone: 'info', lines: ['This looks like a big multi-part project. Routing it to the GitHub pipeline (uses your secrets, commits artifacts, no browser credit spent).'], ts: stamp() });
                    await pipelineTurn(userText, atts);
                    return;
                }
                if (usePuter && heavy && !remoteToken.trim()) {
                    pushMessage({ id: uid(), kind: 'card', title: 'HEAVY BUILD DETECTED', tone: 'warn', lines: ['This is a big build. Add a GitHub token in PIPELINE to run it on the free background pipeline, or continue here with Puter (spends your Puter credits).'], ts: stamp() });
                }
                setBusy(true);
                window.__nexusBusy = true;
                window.__nexusWake.request();
                const t0 = performance.now();
                const thoughtId = uid();
                pushMessage({ id: thoughtId, kind: 'thought', secs: '...', lines: [], ts: stamp() });
                try {
                    const hist = messagesRef.current
                        .filter(m => m.role)
                        .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }))
                        .slice(-12);
                    // Build the final user message: multimodal when images are attached
                    let finalContent = userText;
                    const images = (atts || []).filter(a => a.kind === 'image');
                    const textAtts = (atts || []).filter(a => a.kind === 'text');
                    if (textAtts.length) {
                        finalContent += '\n\n' + textAtts.map(a => '[Attached file: ' + a.name + ']\n```\n' + a.text.slice(0, 8000) + '\n```').join('\n\n');
                    }
                    if (images.length) {
                        finalContent = [
                            { type: 'text', text: finalContent || '(image attached)' },
                            ...images.map(a => ({ type: 'image_url', image_url: { url: a.dataUrl } })),
                        ];
                    }
                    const messagesPayload = [
                        { role: 'system', content: buildSystemPrompt(activeChat && activeChat.memory) },
                        ...hist,
                        { role: 'user', content: finalContent },
                    ];
                    let out = await brainCall(messagesPayload, { jsonMode: true, temperature: 0.4 });
                    // ---- AUTONOMOUS RESEARCH: if the task needs info the model lacks,
                    //      automatically dispatch a research round with web_search + api_call.
                    //      The user never has to name a tool. ----
                    const RESEARCH_TRIGGERS = /current|latest|news|trend|price|weather|who|what is|how does|compare|top |best |2026|api|youtube|reddit|hacker news|stock|statistics|rank|review|vs\./i;
                    const firstPass = out;
                    if (out && !Array.isArray(out.tool_calls) && RESEARCH_TRIGGERS.test(userText) && !isHeavyBuild(userText)) {
                        pushMessage({ id: uid(), kind: 'card', title: 'AUTONOMOUS RESEARCH', tone: 'info', lines: ['This task needs current information. Searching automatically...'], ts: stamp() });
                        const queries = [userText.slice(0, 140), userText.slice(0, 80) + ' 2026'];
                        const results = [];
                        for (let qi = 0; qi < Math.min(2, queries.length); qi++) {
                            const r = await runTool('web_search', { query: queries[qi] }, { remoteToken });
                            if (r && !String(r).startsWith('[')) results.push('Query: ' + queries[qi] + '\n' + r);
                        }
                        if (!results.length) {
                            const apiRes = await runTool('api_call', { api: 'hn', params: { q: userText.slice(0, 60) } }, { remoteToken });
                            results.push('Hacker News search: ' + String(apiRes).slice(0, 1500));
                        }
                        pushMessage({ id: uid(), kind: 'card', title: 'RESEARCH COMPLETE', tone: 'ok', lines: ['Found ' + results.length + ' source(s). Now generating the answer with real data.'], ts: stamp() });
                        out = await brainCall([
                            { role: 'system', content: buildSystemPrompt(activeChat && activeChat.memory) },
                            ...hist,
                            { role: 'user', content: finalContent },
                            { role: 'assistant', content: JSON.stringify({ reasoning: firstPass.reasoning || [] }) },
                            { role: 'user', content: 'RESEARCH RESULTS:\n' + results.join('\n\n---\n\n').slice(0, 9000) + '\n\nNow answer the original request using this data where relevant. Cite sources inline.' },
                        ], { jsonMode: true, temperature: 0.4 });
                    }
                    // ---- TOOL LOOP: the agent calls tools, sees results, continues ----
                    for (let round = 0; round < 4 && !stopRef.current && out && Array.isArray(out.tool_calls) && out.tool_calls.length; round++) {
                        const results = [];
                        for (const tc of out.tool_calls.slice(0, 3)) {
                            const tName = String(tc.tool || '');
                            const tArgs = tc.args || {};
                            const cardId = uid();
                            pushMessage({ id: cardId, kind: 'card', title: 'TOOL · ' + tName.toUpperCase(), tone: 'info', lines: ['Executing ' + tName + ' ' + JSON.stringify(tArgs).slice(0, 100)], ts: stamp() });
                            let res;
                            try { res = await runTool(tName, tArgs, { remoteToken }); }
                            catch (e) { res = 'Tool error: ' + (e.message || e); }
                            updateMessage(cardId, { tone: (res === 'PASS' || res.startsWith('Saved')) ? 'ok' : (String(res).startsWith('FAIL') || String(res).startsWith('[')) ? 'warn' : 'ok', lines: ['Result:', String(res).slice(0, 700)] });
                            results.push({ tool: tName, args: tArgs, result: String(res).slice(0, 3000) });
                        }
                        out = await brainCall([
                            { role: 'system', content: buildSystemPrompt(activeChat && activeChat.memory) },
                            ...hist,
                            { role: 'user', content: finalContent },
                            { role: 'assistant', content: JSON.stringify({ tool_calls: out.tool_calls }) },
                            { role: 'user', content: 'Tool results:\n' + results.map(r => '### ' + r.tool + '\n' + r.result).join('\n\n') + '\n\nContinue and produce the final reply (use more tools only if still needed).' },
                        ], { jsonMode: true, temperature: 0.3 });
                    }
                    const secs = ((performance.now() - t0) / 1000).toFixed(1);
                    if (lastBrainFallback) {
                        pushMessage({ id: uid(), kind: 'card', title: 'LIMIT HIT · AUTO-FALLBACK', tone: 'warn', lines: [lastBrainFallback.from.toUpperCase() + ' hit its limit - this reply used ' + lastBrainFallback.to.toUpperCase() + ' instead. Switch to AUTO in BRAIN to always use the best available model.'], ts: stamp() });
                        lastBrainFallback = null;
                    }
                    const prov = lastBrainProvider || (loadBrain().provider ? loadBrain().provider.toUpperCase() : '--');
                    updateMessage(thoughtId, { secs, lines: out.reasoning || ['Classifying directive...', 'Resolving context...', 'Formulating response...'] });
                    setProviderTag(prov);
                    if (out.reply) pushMessage({ id: uid(), role: 'agent', text: out.reply, provider: prov, ts: stamp() });
                    if (out.suggestions && Array.isArray(out.suggestions) && out.suggestions.length && out.status !== 'clarify') {
                        pushMessage({ id: uid(), kind: 'suggestions', items: out.suggestions.slice(0, 3), ts: stamp() });
                    }
                    if (out.status === 'clarify' && Array.isArray(out.questions) && out.questions.length) {
                        pushMessage({ id: uid(), kind: 'questions', items: out.questions.slice(0, 4), ts: stamp() });
                    }
                    if (out.status === 'plan' && Array.isArray(out.plan) && out.plan.length) {
                        pushMessage({ id: uid(), kind: 'plan', items: out.plan.slice(0, 6), ts: stamp() });
                        if (autoContinueRef.current) {
                            const phases = out.plan.slice(0, 3);
                            pushMessage({ id: uid(), kind: 'card', title: 'AUTO-CONTINUE · EXECUTING PLAN', tone: 'info', lines: ['Executing ' + phases.length + ' phase(s) automatically. STOP anytime.'], ts: stamp() });
                            for (const ph of phases) {
                                if (stopRef.current) { stopRef.current = false; break; }
                                await agentTurn('Build phase ' + ph.phase + ': ' + ph.title + '. ' + (ph.detail || ''), []);
                            }
                        }
                    }
                    // ---- project memory: remember what exists and what remains ----
                    if (out.project_update) {
                        const pu = out.project_update;
                        setChats(prev => prev.map(c => {
                            if (c.id !== activeChatId) return c;
                            const mem = c.memory || {};
                            const files = Array.from(new Set([...(mem.files || []), ...(pu.files_built || [])]));
                            return { ...c, memory: { goal: mem.goal || pu.goal || '', files, next: pu.next_steps || mem.next || [], notes: pu.notes || mem.notes || '', skills: mem.skills || [] } };
                        }));
                    }
                    // detect SKILL LOADED tool results and persist the skill
                    const lastTools = (out.tool_calls || []).filter(tc => tc.tool === 'load_skill');
                    for (const tc of lastTools) {
                        const sk = String((tc.args || {}).skill || '').toLowerCase().trim();
                        if (SKILL_PACKS[sk]) {
                            setChats(prev => prev.map(c => c.id === activeChatId ? { ...c, memory: { ...(c.memory || {}), skills: Array.from(new Set([...(c.memory && c.memory.skills ? c.memory.skills : []), sk])) } } : c));
                        }
                    }
                    // Multi-file support: out.files = {name: content} OR out.artifact (single)
                    const built = [];
                    if (out.artifact && out.artifact.content) built.push(out.artifact);
                    if (out.files && typeof out.files === 'object') {
                        for (const [fname, fcontent] of Object.entries(out.files)) {
                            if (fcontent && String(fcontent).trim().length > 10) {
                                built.push({ filename: fname, language: (fname.split('.').pop() || 'txt').toLowerCase(), content: String(fcontent) });
                            }
                        }
                    }
                    if (built.length) {
                        const primary = built.find(a => /\.html?$/.test(a.filename || '')) || built[0];
                        for (const art of built) {
                            const artId = uid();
                            pushMessage({ id: artId, kind: 'artifact', filename: art.filename || 'app.html', lang: (art.language || 'html').toUpperCase(), content: art.content, summary: art.summary || '', iterations: [1], review: null, ts: stamp() });
                            if (art === primary) {
                                await runReviewLoop(artId, userText, art);
                            }
                        }
                        const finalMsg = messagesRef.current.find(m => m.id && m.kind === 'artifact' && (m.content || '') === primary.content);
                        if (finalMsg && finalMsg.content) maybeLearnLesson(userText, finalMsg.content);
                    }
                } catch (err) {
                    updateMessage(thoughtId, { secs: '0.0', lines: ['Engine call failed.'] });
                    pushMessage({ id: uid(), kind: 'card', title: 'ENGINE ERROR', tone: 'error', lines: [String(err.message || err)], ts: stamp() });
                } finally {
                    setBusy(false);
                    window.__nexusBusy = false;
                    window.__nexusWake.release();
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (busy) return;
                const text = chatInput.trim();
                if (!text && !attachments.length) return;
                const atts = attachments;
                lastUserTextRef.current = text || '(attachment only)';
                saveRecent(text || '(attachment only)');
                // auto-title chat from first user message
                setChats(prev => prev.map(c => c.id === activeChatId && c.title && /^Chat \d+$/.test(c.title) ? { ...c, title: (text || 'New chat').slice(0, 34) } : c));
                setChatInput('');
                setAttachments([]);
                pushMessage({ id: uid(), role: 'user', text: text || '(attachment only)', attachments: atts, ts: stamp() });
                agentTurn(text, atts);
            };
            const stopAgent = () => {
                stopRef.current = true;
                if (window.__nexusStopRef && window.__nexusStopRef.current) { try { window.__nexusStopRef.current.abort(); } catch (e) {} window.__nexusStopRef.current = null; }
                setBusy(false);
                pushMessage({ id: uid(), kind: 'card', title: 'STOPPED', tone: 'warn', lines: ['Task stopped. You can retry or ask differently.'], ts: stamp() });
            };
            const retryLast = () => {
                if (busy || !lastUserTextRef.current) return;
                pushMessage({ id: uid(), kind: 'card', title: 'RETRY', tone: 'info', lines: ['Re-running: ' + lastUserTextRef.current.slice(0, 80)], ts: stamp() });
                agentTurn(lastUserTextRef.current, []);
            };

            // Tap-to-answer: the selected option is sent immediately so Nexus
            // sees the answer in context and continues the thread.
            const handleQuickAnswer = (q) => {
                if (busy) return;
                pushMessage({ id: uid(), role: 'user', text: q, ts: stamp() });
                agentTurn(q);
            };

            /* ---- settings ---- */
            const saveBrainCfg = () => {
                saveBrain(brainCfg);
                setShowSettings(false);
                pushMessage({ id: uid(), kind: 'card', title: 'BRAIN CONFIGURED', tone: 'ok', lines: ['Mode: ' + (PROVIDER_DEFS[brainCfg.provider] || {}).label + (brainCfg.model ? ' · Model: ' + brainCfg.model : ''), 'Everything is saved in this browser - no need to re-enter it.'], ts: stamp() });
            };
            const testBrain = async () => {
                setTestResult('TESTING...');
                try {
                    const out = await brainCall([{ role: 'user', content: 'Reply with JSON: {"ok": true}' }], { jsonMode: true, temperature: 0 });
                    setTestResult('CONNECTION OK via ' + (lastBrainProvider || '?') + ': ' + JSON.stringify(out));
                } catch (e) { setTestResult('FAILED: ' + (e.message || e)); }
            };

            /* ---- remote pipeline ---- */
            const handleRemoteDispatch = async () => {
                if (!remoteToken.trim() || !remoteDirective.trim() || remoteBusy) return;
                setRemoteBusy(true); setRemoteStatus('DISPATCHING...');
                try {
                    const res = await fetch(API + '/actions/workflows/run_agent.yml/dispatches', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + remoteToken.trim(), 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ref: 'main', inputs: { prompt: remoteDirective.trim(), mode: 'full' } }),
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    try { localStorage.setItem('nexus_remote_token', remoteToken.trim()) } catch (e) {}
                    setRemoteStatus('RUN STARTED - TRACKING...');
                    let run = null;
                    for (let i = 0; i < 10; i++) {
                        await new Promise(r => setTimeout(r, 4000));
                        const r2 = await fetch(API + '/actions/runs?event=workflow_dispatch&per_page=1', { headers: { 'Authorization': 'Bearer ' + remoteToken.trim(), 'Accept': 'application/vnd.github+json' } });
                        const d = await r2.json();
                        if (d.workflow_runs && d.workflow_runs.length) {
                            run = d.workflow_runs[0];
                            if (run.status !== 'queued' && run.status !== 'in_progress') break;
                            setRemoteStatus('RUN #' + run.run_number + ' - ' + run.status.toUpperCase());
                        }
                    }
                    if (run) {
                        setRemoteStatus('RUN #' + run.run_number + ' - ' + (run.status === 'completed' ? run.conclusion.toUpperCase() : run.status.toUpperCase()));
                        setMemoryEpoch(e => e + 1);
                    }
                } catch (e) { setRemoteStatus('ERROR: ' + e.message); }
                finally { setRemoteBusy(false); }
            };

            const memoryLessons = (memoryData && memoryData.lessons) ? memoryData.lessons : [];
            const chatMemory = loadChatMemory();

            const renderMessage = (m) => {
                if (m.kind === 'thought') {
                    const open = expandedThought === m.id;
                    return (
                        <div className="animate-fadeup">
                            <button onClick={() => setExpandedThought(open ? null : m.id)} className="flex items-center gap-2 text-[11px] font-mono text-stone-500 hover:text-ember-600 transition-colors group">
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" className="text-ember-500"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.8" /><path d="M12 7v5l3 2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" /></svg>
                                Thought for {m.secs}s
                                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" className={'transition-transform ' + (open ? 'rotate-180' : '') + ' text-stone-400'}><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" /></svg>
                                <span className="text-[9px] text-stone-400 group-hover:text-ember-600">{open ? 'HIDE' : 'VIEW REASONING'}</span>
                            </button>
                            {open && (
                                <div className="mt-1.5 ml-1 rounded-xl border border-cream-300 bg-white px-3.5 py-3 space-y-1.5">
                                    <div className="text-[8px] font-mono tracking-[0.18em] text-stone-400">REASONING TRACE</div>
                                    {(m.lines || []).map((l, i) => <div key={i} className="text-[11px] font-mono leading-relaxed text-stone-600">▸ {l}</div>)}
                                </div>
                            )}
                        </div>
                    );
                }
                if (m.kind === 'plan') {
                    return (
                        <div className="animate-fadeup rounded-2xl border border-cream-300 bg-white shadow-soft overflow-hidden">
                            <div className="flex items-center justify-between px-3.5 py-2 border-b border-cream-200 bg-cream-50">
                                <span className="text-[9px] font-mono tracking-[0.18em] text-stone-500">BUILD PLAN</span>
                                <button onClick={() => agentTurn('Build all phases now, starting with phase 1. Execute the full plan.')} className="text-[9px] font-mono text-ember-600 hover:text-ember-700 border border-ember-200 bg-ember-50 px-2 py-1 rounded-md">BUILD ALL</button>
                            </div>
                            <div className="p-3 space-y-1.5">
                                {(m.items || []).map((p, i) => (
                                    <button key={i} onClick={() => agentTurn('Build phase ' + p.phase + ': ' + p.title + '. ' + (p.detail || ''))} className="w-full text-left flex items-start gap-2.5 rounded-xl border border-cream-300 bg-cream-50/60 hover:border-ember-300 hover:bg-ember-50/40 px-3 py-2.5 transition-all">
                                        <span className="text-[9px] font-mono text-ember-600 border border-ember-200 bg-white rounded-md px-1.5 py-0.5 shrink-0">PHASE {p.phase}</span>
                                        <span className="min-w-0">
                                            <span className="block text-[12px] font-medium text-stone-700">{p.title}</span>
                                            {p.detail && <span className="block text-[10.5px] text-stone-500 leading-snug">{p.detail}</span>}
                                        </span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    );
                }
                if (m.kind === 'puterPrompt') {
                    return (
                        <div className="animate-fadeup rounded-2xl border border-ember-300 bg-ember-50/60 p-4 shadow-soft">
                            <div className="text-[10px] font-semibold tracking-[0.14em] text-ember-700 mb-2">CONNECT NEXUS TO A BRAIN</div>
                            <div className="text-[12px] leading-relaxed text-stone-600 mb-3">One tap signs you into Puter - free account, no API key, and Nexus thinks with <b>Claude Fable 5</b>.</div>
                            <button
                                onClick={async () => {
                                    try {
                                        await ensurePuter();
                                        const c = loadBrain(); c.provider = 'puter'; saveBrain(c);
                                        pushMessage({ id: uid(), kind: 'card', title: 'PUTER CONNECTED', tone: 'ok', lines: ['You are signed in. Nexus now thinks with Claude Fable 5. Everything is saved in this browser.'], ts: stamp() });
                                    } catch (e) {
                                        pushMessage({ id: uid(), kind: 'card', title: 'SIGN-IN FAILED', tone: 'error', lines: [String(e.message || e)], ts: stamp() });
                                    }
                                }}
                                className="w-full text-[11px] font-mono btn-primary text-white px-4 py-3 rounded-xl tracking-wider transition-all shadow-soft"
                            >
                                SIGN IN WITH PUTER → CLAUDE FABLE 5
                            </button>
                            <div className="text-[9px] text-stone-400 mt-2 leading-relaxed">Prefer keys? Open BRAIN and add a free Gemini or Groq key instead.</div>
                        </div>
                    );
                }
                if (m.kind === 'suggestions') {
                    return (
                        <div className="animate-fadeup">
                            <div className="text-[9px] font-mono text-stone-400 mb-1.5 tracking-wider">TAP TO CONTINUE</div>
                            <div className="flex flex-wrap gap-2">
                                {(m.items || []).map((q, i) => (
                                    <button key={i} onClick={() => handleQuickAnswer(q)} className="text-[11px] font-mono border border-cream-400 bg-white text-stone-600 hover:text-ember-600 hover:border-ember-300 px-3.5 py-2 rounded-full transition-all shadow-soft">
                                        {q}
                                    </button>
                                ))}
                            </div>
                        </div>
                    );
                }
                if (m.kind === 'questions') {
                    return (
                        <div className="animate-fadeup">
                            <div className="text-[9px] font-mono text-stone-400 mb-1.5 tracking-wider">TAP AN ANSWER - IT SENDS AUTOMATICALLY</div>
                            <div className="flex flex-wrap gap-2">
                                {(m.items || []).map((q, i) => (
                                    <button key={i} onClick={() => handleQuickAnswer(q)} className="text-[11px] font-mono border border-cream-400 bg-white text-stone-600 hover:text-ember-600 hover:border-ember-300 px-3.5 py-2 rounded-full transition-all shadow-soft">
                                        {q}
                                    </button>

                    return (

                if (m.kind === 'artifact') {

                                <span className="text-[10px] font-mono text-stone-700 truncate flex-1">{m.filename}</span>
                                <span className="text-[8px] font-mono px-1.5 py-0.5 rounded bg-ember-100 text-ember-700 tracking-wider">{m.lang}</span>
                                <span className="text-[9px] font-mono text-stone-400">×{(m.iterations || 1)}</span>
                                {m.review && m.review.decision === 'approve' && <span className="text-[8px] font-mono px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700">APPROVED</span>}
                                {m.sandbox && <span className={'text-[8px] font-mono px-1.5 py-0.5 rounded ' + (m.sandbox === 'PASS' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-600')}>{m.sandbox === 'PASS' ? 'SANDBOX PASS' : 'SANDBOX FAIL'}</span>}
                                <span className="flex-1"></span>
                                <button onClick={() => copyText(m.content)} className="text-[9px] font-mono text-stone-400 hover:text-ember-600" title="Copy code">COPY</button>
                                <button onClick={() => { const arts = messages.filter(x => x.kind === 'artifact').map(x => ({ filename: x.filename, content: x.content })); downloadAllZip(arts); }} className="text-[9px] font-mono text-stone-400 hover:text-ember-600" title="Download all artifacts as zip">ZIP ALL</button>
                                <button onClick={() => downloadBlob(m.content, m.filename)} className="text-[9px] font-mono text-ember-600 hover:text-ember-700 border border-ember-200 bg-ember-50 px-2 py-1 rounded-md">DOWNLOAD</button>
                                <button onClick={() => { setPreviewHtml(m.content); setActiveView('preview'); }} className="text-[9px] font-mono text-stone-500 hover:text-ember-600">PREVIEW</button>
                                <button onClick={async () => {

                                    } catch (e) { pushMessage({ id: uid(), kind: 'card', title: 'SAVE FAILED', tone: 'error', lines: [String(e.message || e)], ts: stamp() }); }

                            </div>
