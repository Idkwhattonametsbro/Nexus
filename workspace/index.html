<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nexus Autonomous Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        cream: { 50: '#FDFCFA', 100: '#FAF8F4', 200: '#F4EFE7', 300: '#EBE4D8', 400: '#DDD3C3', 500: '#C9BFAE' },
                        ember: { 50: '#FFF7ED', 100: '#FFEDD5', 200: '#FED7AA', 300: '#FDBA74', 400: '#FB923C', 500: '#F97316', 600: '#EA580C', 700: '#C2410C' },
                    },
                    boxShadow: {
                        soft: '0 1px 2px rgba(28,25,23,0.05), 0 4px 14px rgba(28,25,23,0.06)',
                        lift: '0 10px 34px rgba(28,25,23,0.12)',
                        ember: '0 0 0 1px rgba(249,115,22,0.30), 0 6px 22px rgba(249,115,22,0.22)',
                    },
                    keyframes: {
                        fadeup: { '0%': { opacity: '0', transform: 'translateY(5px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        pulseDot: { '0%,100%': { opacity: '0.4' }, '50%': { opacity: '1' } },
                    },
                    animation: { fadeup: 'fadeup 0.28s ease-out both', pulseDot: 'pulseDot 1.2s ease-in-out infinite' },
                },
            },
        }
    </script>
    <style>
        body { background-color: #FAF8F4; color: #44403C; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #D9D2C4; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #C4BBA9; }
        ::selection { background: rgba(253, 186, 116, 0.45); }
        .brand-gradient { background: linear-gradient(135deg, #FB923C 0%, #EA580C 100%); }
        .btn-primary { background: linear-gradient(135deg, #FB923C 0%, #EA580C 100%); }
        .btn-primary:hover { filter: brightness(1.06); }
        .glow-active { box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.30), 0 0 16px rgba(249, 115, 22, 0.20); }
        #particle-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .app-layer { position: relative; z-index: 10; }
        .glass { background: rgba(253, 252, 250, 0.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        /* Prevent iOS Safari auto-zoom on focus (which breaks the top bar layout) */
        @media (max-width: 639px) {
            input, select, textarea { font-size: 16px !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const REPO = 'Idkwhattonametsbro/Nexus';
        const PAGES_ROOT = 'https://idkwhattonametsbro.github.io/Nexus';
        const ACTIONS_URL = 'https://github.com/' + REPO + '/actions/workflows/run_agent.yml';
        const API = 'https://api.github.com/repos/' + REPO;

        const QUICK_TASKS = [
            'Build me a habit tracker with streaks',
            'Make a pomodoro timer app',
            'Build a personal portfolio page',
            'What can you do?',
        ];

        function stamp() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
        function uid() { return Math.random().toString(36).slice(2, 9); }

        /* ================= BRAIN ENGINE (browser-native agent) ================= */
        const BRAIN_KEY = 'nexus_brain';
        const MEMORY_KEY = 'nexus_chat_memory';
        const HISTORY_KEY = 'nexus_chat_history';

        function loadChatHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [] } catch (e) { return [] } }
        function saveChatHistory(msgs) {
            try {
                const slim = msgs.map(m => {
                    const s = { id: m.id, role: m.role, kind: m.kind, ts: m.ts, text: m.text && m.text.slice(0, 20000) };
                    if (m.kind === 'thought') s.lines = (m.lines || []).slice(0, 8);
                    if (m.kind === 'questions') s.items = (m.items || []).slice(0, 4);
                    if (m.kind === 'artifact') { s.filename = m.filename; s.lang = m.lang; s.summary = m.summary; s.iterations = m.iterations; s.review = m.review; s.content = (m.content || '').slice(0, 30000); }
                    if (m.kind === 'card') s.title = m.title; s.tone = m.tone;
                    if (m.attachments) s.attachments = m.attachments.map(a => a.kind === 'image' ? { id: a.id, kind: 'image', name: a.name, dataUrl: (a.dataUrl || '').slice(0, 400000) } : { id: a.id, kind: a.kind, name: a.name });
                    return s;
                }).slice(-60);
                localStorage.setItem(HISTORY_KEY, JSON.stringify(slim));
            } catch (e) {}
        }

        const PROVIDER_DEFS = {
            auto: { label: 'AUTO · best available (Puter → Gemini → Groq → …)', defaultModel: '' },
            puter: { label: 'Puter · Claude Fable 5 (browser sign-in)', defaultModel: 'claude-fable-5', models: ['claude-fable-5', 'claude-opus-5', 'claude-sonnet-5', 'claude-sonnet-4.6', 'gpt-5.5', 'gpt-5.4', 'gemini-3.1-flash-lite', 'deepseek-r1'] },
            gemini: { url: 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions', defaultModel: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash (free, vision)' },
            groq: { url: 'https://api.groq.com/openai/v1/chat/completions', defaultModel: 'openai/gpt-oss-120b', label: 'Groq (free, vision)' },
            github: { url: 'https://models.inference.ai.azure.com/chat/completions', defaultModel: 'gpt-4.1-mini', label: 'GitHub Models (free)' },
            cerebras: { url: 'https://api.cerebras.ai/v1/chat/completions', defaultModel: 'llama-3.3-70b', label: 'Cerebras (free)' },
            openrouter: { url: 'https://openrouter.ai/api/v1/chat/completions', defaultModel: 'meta-llama/llama-3.3-70b-instruct:free', label: 'OpenRouter' },
            deepseek: { url: 'https://api.deepseek.com/chat/completions', defaultModel: 'deepseek-v4-flash', label: 'DeepSeek' },
        };

        function loadBrain() { try { return JSON.parse(localStorage.getItem(BRAIN_KEY)) || {} } catch (e) { return {} } }
        function saveBrain(c) { try { localStorage.setItem(BRAIN_KEY, JSON.stringify(c)) } catch (e) {} }
        function brainConfigured() {
            const c = loadBrain();
            if (c.provider === 'puter') return true;
            if (c.keys) { for (const p of BRAIN_ORDER) if (c.keys[p]) return true; }
            return !!(c.key && c.key.trim());
        }

        function loadChatMemory() { try { return JSON.parse(localStorage.getItem(MEMORY_KEY)) || [] } catch (e) { return [] } }
        function addLesson(l) { const arr = loadChatMemory(); arr.push(l); try { localStorage.setItem(MEMORY_KEY, JSON.stringify(arr.slice(-10))) } catch (e) {} }

        function parseJson(content) {
            let c = (content || '').trim();
            try { return JSON.parse(c); } catch (e) {}
            const m = c.match(/```(?:json)?\s*([\s\S]*?)```/);
            if (m) { try { return JSON.parse(m[1].trim()) } catch (e) {} }
            const s = c.indexOf('{'), e = c.lastIndexOf('}');
            if (s >= 0 && e > s) { try { return JSON.parse(c.slice(s, e + 1)) } catch (_) {} }
            throw new Error('Model did not return valid JSON.');
        }

        /* ---- Puter.js bridge (browser-only, user-pays: Claude Fable 5 / Opus 5 / etc.) ---- */
        function loadPuterScript() {
            return new Promise((resolve, reject) => {
                if (window.puter && window.puter.ai) return resolve();
                const s = document.createElement('script');
                s.src = 'https://js.puter.com/v2/';
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('Failed to load the Puter SDK (check connection).'));
                document.head.appendChild(s);
            });
        }
        async function ensurePuter() {
            await loadPuterScript();
            if (window.puter.auth && !window.puter.auth.isSignedIn()) {
                await window.puter.auth.signIn(); // popup; must come from a user gesture
            }
        }
        async function puterBrainCall(messages, opts = {}) {
            await ensurePuter();
            const cfg = loadBrain();
            const def = PROVIDER_DEFS.puter;
            const model = cfg.model && cfg.model.trim() ? cfg.model.trim() : def.defaultModel;
            // Extract a possible image from the last multimodal user message
            let imageUrl = null;
            let msgs = messages;
            const last = messages[messages.length - 1];
            if (last && Array.isArray(last.content)) {
                const img = last.content.find(p => p.type === 'image_url');
                if (img) imageUrl = img.image_url.url;
                const txt = last.content.filter(p => p.type === 'text').map(p => p.text).join('\n');
                msgs = [...messages.slice(0, -1), { role: 'user', content: txt }];
            }
            const chatArgs = [msgs, { model }];
            if (imageUrl) chatArgs.splice(1, 0, imageUrl);
            let resp;
            try {
                resp = await window.puter.ai.chat(...chatArgs);
            } catch (err) {
                const code = String((err && (err.code || err.error)) || '');
                const msg = String((err && (err.message || err.error)) || err);
                if (/insufficient_funds|usage-limited|402/i.test(code + ' ' + msg)) {
                    throw new Error('Puter credit limit reached. Top up at puter.com or switch provider in BRAIN - the GitHub pipeline keeps working automatically.');
                }
                throw new Error('Puter error: ' + msg.slice(0, 120));
            }
            let text = '';
            const content = resp && resp.message && resp.message.content;
            if (Array.isArray(content)) text = content.map(p => (p && p.text) || '').join('');
            else if (typeof content === 'string') text = content;
            else if (resp && typeof resp.text === 'string') text = resp.text;
            else text = String(resp || '');
            return opts.jsonMode ? parseJson(text) : text;
        }
        async function puterStream(messages, opts = {}) {
            /* Returns an async iterator of text chunks; also works in JSON mode
               (caller accumulates and parses at the end). */
            await ensurePuter();
            const cfg = loadBrain();
            const def = PROVIDER_DEFS.puter;
            const model = cfg.model && cfg.model.trim() ? cfg.model.trim() : def.defaultModel;
            let msgs = messages;
            const last = messages[messages.length - 1];
            if (last && Array.isArray(last.content)) {
                const txt = last.content.filter(p => p.type === 'text').map(p => p.text).join('\n');
                msgs = [...messages.slice(0, -1), { role: 'user', content: txt }];
            }
            const resp = await window.puter.ai.chat(msgs, { model, stream: true });
            let full = '';
            for await (const part of resp) {
                const chunk = (part && part.text) || '';
                if (chunk) { full += chunk; if (opts.onToken) opts.onToken(chunk); }
            }
            lastBrainProvider = 'PUTER';
            return opts.jsonMode ? parseJson(full) : full;
        }

        /* ---- Rich text renderer: turns model output into clean, organized UI ---- */
        function Inline({ text }) {
            const parts = String(text || '').split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*]+\*)/g);
            return parts.map((p, i) => {
                if (/^\*\*[^*]+\*\*$/.test(p)) return <strong key={i} className="font-semibold text-stone-800">{p.slice(2, -2)}</strong>;
                if (/^`[^`]+`$/.test(p)) return <code key={i} className="px-1.5 py-0.5 rounded-md bg-cream-200 text-ember-700 font-mono text-[11px]">{p.slice(1, -1)}</code>;
                if (/^\*[^*]+\*$/.test(p)) return <em key={i} className="italic text-stone-500">{p.slice(1, -1)}</em>;
                return <span key={i}>{p}</span>;
            });
        }
        function renderRich(text) {
            const blocks = String(text || '').split(/\n{2,}/);
            return blocks.map((b, i) => {
                const t = b.trim();
                if (!t) return null;
                if (t.startsWith('```')) {
                    const lines = b.split('\n');
                    const code = lines.slice(1, lines.length - (lines[lines.length - 1].trim() === '```' ? 1 : 0)).join('\n');
                    return <pre key={i} className="my-2 rounded-xl bg-cream-100 border border-cream-300 px-4 py-3 font-mono text-[11px] leading-relaxed text-stone-700 overflow-x-auto custom-scrollbar whitespace-pre-wrap">{code}</pre>;
                }
                const heading = t.match(/^(#{1,4})\s+(.*)/);
                if (heading) {
                    const size = heading[1].length >= 3 ? 'text-[12px]' : 'text-[13px]';
                    return <div key={i} className={size + ' font-semibold text-stone-800 mt-2.5 mb-1'}><Inline text={heading[2]} /></div>;
                }
                const lines = b.split('\n');
                if (lines.every(l => /^[-*•]\s+/.test(l.trim()))) {
                    return (
                        <div key={i} className="my-1.5 space-y-1">
                            {lines.map((l, j) => (
                                <div key={j} className="flex gap-2 text-[13px] leading-relaxed text-stone-600">
                                    <span className="text-ember-500 shrink-0 mt-px">•</span>
                                    <span><Inline text={l.replace(/^[-*•]\s+/, '')} /></span>
                                </div>
                            ))}
                        </div>
                    );
                }
                if (lines.every(l => /^\d+\.\s+/.test(l.trim()))) {
                    return (
                        <div key={i} className="my-1.5 space-y-1">
                            {lines.map((l, j) => (
                                <div key={j} className="flex gap-2 text-[13px] leading-relaxed text-stone-600">
                                    <span className="text-stone-400 font-mono text-[11px] shrink-0 pt-px">{l.match(/^\d+/)[0]}.</span>
                                    <span><Inline text={l.replace(/^\d+\.\s+/, '')} /></span>
                                </div>
                            ))}
                        </div>
                    );
                }
                return (
                    <p key={i} className="text-[13px] leading-relaxed text-stone-600 my-1">
                        {lines.map((l, j) => <span key={j}>{j > 0 && <br />}<Inline text={l} /></span>)}
                    </p>
                );
            });
        }

        /* ---- Multi-model chain: Puter (if signed in) -> saved keys (auto failover) ---- */
        let lastBrainProvider = null;
        const BRAIN_ORDER = ['puter', 'gemini', 'groq', 'github', 'cerebras', 'openrouter', 'deepseek'];

        function providerKey(p) {
            const cfg = loadBrain();
            if (cfg.keys && cfg.keys[p]) return cfg.keys[p];
            if (p === cfg.provider && cfg.key) return cfg.key; // legacy single-key
            return '';
        }
        function configuredProviders() {
            const cfg = loadBrain();
            const chosen = (cfg.provider && PROVIDER_DEFS[cfg.provider]) ? cfg.provider : 'auto';
            const pool = BRAIN_ORDER.filter(p => {
                if (p === 'puter') return true; // verified live (no popup)
                return !!providerKey(p);
            });
            if (chosen !== 'auto') return pool.filter(p => p === chosen);
            return pool;
        }
        async function puterAvailable() {
            try {
                await loadPuterScript();
                return !!(window.puter && window.puter.auth && window.puter.auth.isSignedIn && window.puter.auth.isSignedIn());
            } catch (e) { return false; }
        }
        async function keyedBrainCall(messages, opts, provider) {
            const def = PROVIDER_DEFS[provider];
            const cfg = loadBrain();
            const model = cfg.model && cfg.model.trim() ? cfg.model.trim() : def.defaultModel;
            const headers = { 'Authorization': 'Bearer ' + providerKey(provider), 'Content-Type': 'application/json' };
            if (provider === 'openrouter') { headers['HTTP-Referer'] = window.location.origin; headers['X-Title'] = 'Nexus Workspace'; }
            const body = { model, messages, temperature: opts.temperature || 0.4 };
            if (opts.jsonMode) body.response_format = { type: 'json_object' };
            let res = await fetch(def.url, { method: 'POST', headers, body: JSON.stringify(body) });
            if (!res.ok) {
                const txt = await res.text();
                if (res.status === 400 && opts.jsonMode) {
                    delete body.response_format;
                    res = await fetch(def.url, { method: 'POST', headers, body: JSON.stringify(body) });
                    if (!res.ok) throw new Error('API ' + res.status + ': ' + txt.slice(0, 160));
                } else {
                    throw new Error('API ' + res.status + ': ' + txt.slice(0, 200));
                }
            }
            const data = await res.json();
            const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
            if (!content) throw new Error('Empty response from model.');
            return opts.jsonMode ? parseJson(content) : content;
        }
        async function brainCall(messages, opts = {}) {
            const pool = configuredProviders();
            if (!pool.length) throw new Error('No brain configured. Open BRAIN and sign in with Puter or add an API key.');
            const cfg = loadBrain();
            const chosen = (cfg.provider && PROVIDER_DEFS[cfg.provider]) ? cfg.provider : 'auto';
            const errors = [];
            for (const p of pool) {
                try {
                    if (p === 'puter') {
                        if (!(await puterAvailable())) { errors.push('Puter: not signed in'); continue; }
                        const r = await puterBrainCall(messages, opts);
                        lastBrainProvider = 'PUTER';
                        return r;
                    }
                    const r = await keyedBrainCall(messages, opts, p);
                    lastBrainProvider = p.toUpperCase();
                    return r;
                } catch (e) {
                    errors.push(p + ': ' + (e.message || e));
                    if (chosen !== 'auto') throw e;
                }
            }
            throw new Error('All brains failed: ' + errors.join(' | '));
        }

        function buildSystemPrompt() {
            const mem = loadChatMemory();
            const memoryBlock = mem.length
                ? '\n\n[Learned rules from prior sessions]\n' + mem.map(l => '- ' + l).join('\n')
                : '';
            return (
                'You are Nexus, an autonomous software engineering agent embedded in a chat workspace. ' +
                'You build complete, polished single-file web apps (all HTML/CSS/JS inline), tools, dashboards, and technical analyses. ' +
                '\n\nBEHAVIOR' +
                '\n- Be concise but warm. Explain what you will build before building it.' +
                '\n- If a request is ambiguous or too large, do NOT guess: set status "clarify" and give 2-4 concrete questions.' +
                '\n- Put 3-6 short reasoning bullets in "reasoning" before acting.' +
                '\n- When building, produce ONE complete standalone artifact in "artifact". Never truncate code. No external dependencies unless requested.' +
                '\n- Default design language (unless the user asks otherwise): light premium - creamy white background, soft warm borders, rounded corners, orange accents (#F97316), clean Inter typography.' +
                '\n- GAMES and complex apps must be COMPLETE and playable: full game loop, input handling (keyboard/mouse/touch), win/lose/score states, a visible controls legend, and real polish (animations, sound via WebAudio). Never ship stubs, TODOs, or placeholder logic. If output length is a constraint, prioritize a fully working core over extras.' +
                '\n- After producing an artifact set status "artifact". A review pass will critique it; accept the feedback.' +
                '\n- Never invent credentials, links, or claim actions you did not perform.' +
                '\n- Keep replies under ~120 words unless writing code.' +
                '\n\nOUTPUT: Respond with STRICT JSON only, no markdown fences: {"reasoning": ["..."], "reply": "...", "status": "clarify"|"artifact"|"done", "questions": ["..."], "artifact": {"filename": "app.html", "language": "html", "content": "..."}, "files": {"index.html": "...", "style.css": "..."}}' +
                ' For complex multi-file projects use the "files" object instead of a single "artifact".' +
                '\n\nFORMATTING: Write "reply" in clean, professional structured text: short paragraphs, bullet lists for options and steps, bold (**text**) for key terms and headings (## Section) for sections. Never dump long unstructured paragraphs. The UI renders these nicely.' +
                memoryBlock
            );
        }

        const REVIEW_SYSTEM =
            'You are Nexus Review, a senior design engineer. Critique a generated artifact against its directive. ' +
            'Return STRICT JSON: {"decision": "approve"|"fix", "score": 1-10, "issues": ["..."], "improved": {"filename": "...", "content": "..."}} ' +
            'Score the artifact honestly from 1 (broken) to 10 (production-quality, fully matches the directive). ' +
            'Approve only if score >= 8 and every requested feature works. ' +
            'If decision is "fix", provide the COMPLETE improved standalone artifact in "improved" with every issue resolved. ' +
            'If "approve", "improved" may be null. Never truncate code.';

        const LESSON_SYSTEM =
            'Extract ONE concise objective rule (1 sentence max) about code quality or format from the given task and artifact. ' +
            'If nothing notable, output {"lesson": null}. Return STRICT JSON only.';

        /* ================= PARTICLE BACKGROUND ================= */
        function ParticleCanvas() {
            const ref = useRef(null);
            useEffect(() => {
                const canvas = ref.current;
                const ctx = canvas.getContext('2d');
                let raf, particles = [], w, h, dpr = Math.min(window.devicePixelRatio || 1, 2);
                const resize = () => { w = canvas.clientWidth; h = canvas.clientHeight; canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
                const seed = () => { const n = w < 768 ? 42 : 85; particles = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25, r: 1 + Math.random() * 2.2, warm: Math.random() < 0.6 })); };
                const step = () => {
                    ctx.clearRect(0, 0, w, h);
                    for (const p of particles) {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10;
                        if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = p.warm ? 'rgba(249,115,22,0.28)' : 'rgba(120,105,85,0.20)'; ctx.fill();
                    }
                    for (let i = 0; i < particles.length; i++) for (let j = i + 1; j < particles.length; j++) {
                        const a = particles[i], b = particles[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
                        if (d2 < 130 * 130) {
                            const alpha = (1 - Math.sqrt(d2) / 130) * 0.14;
                            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = 'rgba(234,88,12,' + alpha + ')'; ctx.lineWidth = 1; ctx.stroke();
                        }
                    }
                    raf = requestAnimationFrame(step);
                };
                resize(); seed(); step();
                const onResize = () => { resize(); seed(); };
                window.addEventListener('resize', onResize);
                return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); };
            }, []);
            return <canvas id="particle-canvas" ref={ref}></canvas>;
        }

        /* ================= APP ================= */
        function App() {
            const [activeView, setActiveView] = useState('chat');
            const [chatInput, setChatInput] = useState('');
            const [messages, setMessages] = useState([]);
            const [busy, setBusy] = useState(false);
            const [providerTag, setProviderTag] = useState('--');
            const [expandedThought, setExpandedThought] = useState(null);
            const [memoryData, setMemoryData] = useState(null);
            const [memoryEpoch, setMemoryEpoch] = useState(0);
            const [tree, setTree] = useState(null);
            const [treeHidden, setTreeHidden] = useState(false);
            const [treeEpoch, setTreeEpoch] = useState(0);
            const [runs, setRuns] = useState([]);
            const [lastRun, setLastRun] = useState(null);
            const [previewHtml, setPreviewHtml] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [brainCfg, setBrainCfg] = useState(loadBrain());
            const [testResult, setTestResult] = useState('');
            const [showRemote, setShowRemote] = useState(false);
            const [remoteToken, setRemoteToken] = useState('');
            const [remoteDirective, setRemoteDirective] = useState('');
            const [remoteBusy, setRemoteBusy] = useState(false);
            const [remoteStatus, setRemoteStatus] = useState('');
            const [openFile, setOpenFile] = useState(null);
            const [attachments, setAttachments] = useState([]);
            const fileInputRef = useRef(null);
            const editorRef = useRef(null);
            const chatScrollRef = useRef(null);
            const messagesRef = useRef(messages);
            messagesRef.current = messages;

            const pushMessage = useCallback((m) => setMessages(prev => [...prev, m]), []);
            const updateMessage = useCallback((id, patch) => setMessages(prev => prev.map(m => m.id === id ? (typeof patch === 'function' ? patch(m) : { ...m, ...patch }) : m)), []);

            /* ---- boot ---- */
            useEffect(() => {
                const restored = loadChatHistory();
                if (restored && restored.length) {
                    setMessages(restored);
                    pushMessage({ id: uid(), kind: 'card', title: 'SESSION RESTORED', tone: 'ok', lines: ['Your chat history, keys and settings were saved in this browser. Continue where you left off.'], ts: stamp() });
                    return;
                }
                const boot = [];
                boot.push({ id: uid(), role: 'system', text: 'Nexus Agent initialized. Background brain online.', ts: stamp() });
                if (brainConfigured()) {
                    boot.push({ id: uid(), role: 'agent', text: 'Hey - I am Nexus. I plan, build, review, fix and deliver working apps right here in this chat. Ask me to build something, or tap a quick task below.', ts: stamp() });
                } else if (remoteToken.trim()) {
                    boot.push({ id: uid(), role: 'agent', text: 'Hey - I am Nexus, running through the background pipeline with your GitHub secrets. I plan, build, review, fix and deliver working apps right here in this chat. Ask me to build something, or tap a quick task below.', ts: stamp() });
                } else {
                    boot.push({ id: uid(), kind: 'card', title: 'ONE-TIME SETUP', tone: 'info', lines: ['Nexus thinks in the background using your GitHub secrets - API keys never enter this chat.', 'Tap PIPELINE and paste your GitHub token once (fine-grained, Actions read/write).', 'Stored only in this browser. No LLM keys required.'], ts: stamp() });
                }
                setMessages(boot);
                try { setRemoteToken(localStorage.getItem('nexus_remote_token') || '') } catch (e) {}
            }, []);

            /* ---- data feeds ---- */
            useEffect(() => {
                fetch('config/lessons_learned.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(setMemoryData).catch(() => setMemoryData(null));
                fetch(API + '/git/trees/main?recursive=1', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(d => setTree(d.tree || [])).catch(() => setTree(null));
                fetch('../output/latest_manifest.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(setLastRun).catch(() => setLastRun(null));
                fetch('../output/latest_app.html', { cache: 'no-store' }).then(r => r.ok ? r.text() : Promise.reject()).then(setPreviewHtml).catch(() => setPreviewHtml(null));
                fetch(API + '/actions/runs?per_page=8', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(d => setRuns(d.workflow_runs || [])).catch(() => setRuns([]));
            }, [memoryEpoch]);

            useEffect(() => { if (chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight; }, [messages]);

            // Persist the chat automatically (debounced) - everything is kept
            useEffect(() => {
                const t = setTimeout(() => { if (messages.length) saveChatHistory(messages); }, 900);
                return () => clearTimeout(t);
            }, [messages]);

            const clearSession = () => {
                if (!window.confirm('Clear the saved chat history and start fresh? (Keys and settings stay saved)')) return;
                try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
                setMessages([]);
                const boot = [];
                boot.push({ id: uid(), role: 'system', text: 'Nexus Agent initialized. Fresh session.', ts: stamp() });
                if (brainConfigured()) boot.push({ id: uid(), role: 'agent', text: 'Hey - I am Nexus. Ask me to build something, or just chat.', ts: stamp() });
                setMessages(boot);
            };
            useEffect(() => {
                const vv = window.visualViewport;
                if (!vv) return;
                const onResize = () => {
                    const c = document.getElementById('nexus-composer');
                    if (vv.height < window.innerHeight - 120 && c) setTimeout(() => c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 120);
                };
                vv.addEventListener('resize', onResize);
                return () => vv.removeEventListener('resize', onResize);
            }, []);

            /* ---- Monaco ---- */
            useEffect(() => {
                require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs' } });
                require(['vs/editor/editor.main'], function () {
                    monaco.editor.defineTheme('nexus-light', {
                        base: 'vs', inherit: true, rules: [],
                        colors: {
                            'editor.background': '#FAF8F4', 'editor.lineHighlightBackground': '#F3EEE6',
                            'editorLineNumber.foreground': '#C7C0B4', 'editorLineNumber.activeForeground': '#8A857C',
                            'editorCursor.foreground': '#F97316', 'editor.selectionBackground': '#FED7AA',
                            'editorIndentGuide.background': '#EAE3D6', 'editorIndentGuide.activeBackground': '#D6CFC2',
                            'minimap.background': '#FAF8F4',
                        },
                    });
                    editorRef.current = monaco.editor.create(document.getElementById('monaco-container'), {
                        value: '// Select a file from the workspace tree to inspect it.\n', language: 'plaintext',
                        theme: 'nexus-light', minimap: { enabled: false }, fontFamily: 'JetBrains Mono',
                        fontSize: 12, lineHeight: 19, padding: { top: 12 }, readOnly: true, scrollBeyondLastLine: false,
                    });
                });
            }, []);
            useEffect(() => { if (activeView === 'files' && editorRef.current) setTimeout(() => editorRef.current.layout(), 50); }, [activeView, openFile]);

            const openFileContent = (path) => {
                setOpenFile(path); setActiveView('files');
                fetch('https://raw.githubusercontent.com/' + REPO + '/main/' + path, { cache: 'no-store' })
                    .then(r => r.ok ? r.text() : Promise.reject()).then(txt => {
                        const lang = path.endsWith('.py') ? 'python' : path.endsWith('.html') ? 'html' : path.endsWith('.js') ? 'javascript' : path.endsWith('.json') ? 'json' : path.endsWith('.yml') || path.endsWith('.yaml') ? 'yaml' : path.endsWith('.css') ? 'css' : path.endsWith('.md') ? 'markdown' : 'plaintext';
                        if (editorRef.current) { monaco.editor.setModelLanguage(editorRef.current.getModel(), lang); editorRef.current.setValue(txt); }
                    }).catch(() => { if (editorRef.current) editorRef.current.setValue('// Failed to load ' + path); });
            };

            /* ================= AGENT CORE ================= */
            const downloadBlob = (content, filename) => {
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                document.body.appendChild(a); a.click();
                setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
            };

            /* ---- file / image attachments ---- */
            const fileToDataUrl = (file) => new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result);
                r.onerror = () => reject(new Error('read failed'));
                r.readAsDataURL(file);
            });
            const downscaleImage = (dataUrl, max = 1024) => new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, max / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.max(1, Math.round(img.width * scale));
                    c.height = Math.max(1, Math.round(img.height * scale));
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    resolve(c.toDataURL('image/jpeg', 0.82));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
            const handleAttach = async (files) => {
                const added = [];
                for (const f of Array.from(files || [])) {
                    const base = { id: uid(), name: f.name };
                    if (f.type && f.type.startsWith('image/')) {
                        try {
                            const raw = await fileToDataUrl(f);
                            const dataUrl = await downscaleImage(raw);
                            added.push({ ...base, kind: 'image', dataUrl });
                        } catch (e) { added.push({ ...base, kind: 'file' }); }
                    } else if (f.type && f.type.startsWith('video/')) {
                        // Keep the File reference; uploaded to the repo in pipeline mode
                        added.push({ ...base, kind: 'video', file: f, size: f.size });
                    } else if (f.size < 200 * 1024) {
                        try { added.push({ ...base, kind: 'text', text: await f.text() }); }
                        catch (e) { added.push({ ...base, kind: 'file' }); }
                    } else {
                        added.push({ ...base, kind: 'file' });
                    }
                }
                setAttachments(prev => [...prev, ...added].slice(0, 6));
            };
            const uploadBlobToRepo = async (file, name) => {
                const token = remoteToken.trim();
                if (!token) throw new Error('No GitHub token for upload');
                const dataUrl = await fileToDataUrl(file);
                const base64 = dataUrl.split(',')[1];
                const path = 'chat-uploads/' + Date.now() + '_' + name.replace(/[^a-zA-Z0-9._-]/g, '_');
                const res = await fetch(API + '/contents/' + path, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'nexus: chat upload ' + name, content: base64 }),
                });
                if (!res.ok) throw new Error('Upload HTTP ' + res.status);
                return 'https://raw.githubusercontent.com/' + REPO + '/main/' + path;
            };
            const uploadImageToRepo = async (dataUrl, name) => {
                const token = remoteToken.trim();
                if (!token) throw new Error('No GitHub token for image upload');
                const path = 'chat-uploads/' + Date.now() + '_' + name.replace(/[^a-zA-Z0-9._-]/g, '_');
                const base64 = dataUrl.split(',')[1];
                const res = await fetch(API + '/contents/' + path, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'nexus: chat upload ' + name, content: base64 }),
                });
                if (!res.ok) throw new Error('Upload HTTP ' + res.status);
                return 'https://raw.githubusercontent.com/' + REPO + '/main/' + path;
            };
            const buildAttachmentPrompt = async (userText, atts) => {
                let prompt = userText;
                const textParts = [], imageUrls = [], videoUrls = [];
                for (const a of atts || []) {
                    if (a.kind === 'text') textParts.push('[Attached file: ' + a.name + ']\n```\n' + a.text.slice(0, 8000) + '\n```');
                    else if (a.kind === 'image') {
                        try { imageUrls.push(await uploadImageToRepo(a.dataUrl, a.name)); }
                        catch (e) { pushMessage({ id: uid(), kind: 'card', title: 'IMAGE UPLOAD FAILED', tone: 'error', lines: ['Could not upload ' + a.name + ' to the repo: ' + (e.message || e), 'Your GitHub token needs Contents read/write.'], ts: stamp() }); }
                    } else if (a.kind === 'video') {
                        try { videoUrls.push(await uploadBlobToRepo(a.file, a.name)); }
                        catch (e) { pushMessage({ id: uid(), kind: 'card', title: 'VIDEO UPLOAD FAILED', tone: 'error', lines: ['Could not upload ' + a.name + ': ' + (e.message || e)], ts: stamp() }); }
                    }
                }
                if (textParts.length) prompt += '\n\n' + textParts.join('\n\n');
                if (imageUrls.length) prompt += '\n\n' + imageUrls.map(u => '[IMAGE_URL: ' + u + ']').join('\n');
                if (videoUrls.length) prompt += '\n\nAttached video(s):\n' + videoUrls.map(u => '- [VIDEO_URL: ' + u + ']').join('\n') + '\n(The video is stored in the repo; the model cannot watch it directly - describe what you want done with it.)';
                return prompt;
            };

            const exportChat = () => {
                const lines = messages.map(m => {
                    if (m.kind === 'thought') return '## Thought (' + m.secs + 's)\n' + (m.lines || []).map(l => '- ' + l).join('\n');
                    if (m.kind === 'card') return '## [' + m.title + ']\n' + (m.lines || []).join('\n');
                    if (m.kind === 'artifact') return '## Artifact: ' + m.filename + ' (iterations ' + (m.iterations || 1) + ')\n```html\n' + (m.content || '').slice(0, 4000) + '\n```';
                    if (m.role === 'user') return '## You (' + m.ts + ')\n' + m.text;
                    return '## Nexus (' + m.ts + ')\n' + (m.text || '');
                }).join('\n\n---\n\n');
                downloadBlob('# Nexus Session Export\n\n' + lines, 'nexus-chat-' + Date.now() + '.md');
            };

            const saveToRepo = async (filename, content) => {
                const token = remoteToken.trim() || (loadBrain().githubToken || '');
                if (!token) throw new Error('No GitHub token. Open REMOTE and paste a fine-grained token (Contents read/write).');
                const path = 'chat-outputs/' + filename;
                let sha = null;
                try {
                    const g = await fetch(API + '/contents/' + path, { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
                    if (g.ok) sha = (await g.json()).sha;
                } catch (e) {}
                const res = await fetch(API + '/contents/' + path, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'nexus: chat artifact ' + filename, content: btoa(unescape(encodeURIComponent(content))), sha }),
                });
                if (!res.ok) throw new Error('GitHub ' + res.status);
                return 'https://github.com/' + REPO + '/blob/main/' + path;
            };

            const runReviewLoop = async (artId, directive, artifact) => {
                let current = artifact;
                for (let i = 0; i < 3; i++) {
                    pushMessage({ id: uid(), kind: 'card', title: 'REVIEW PASS ' + (i + 1), tone: 'info', lines: ['Critiquing artifact against directive...'], ts: stamp() });
                    let rev;
                    try {
                        rev = await brainCall([
                            { role: 'system', content: REVIEW_SYSTEM },
                            { role: 'user', content: 'DIRECTIVE:\n' + directive + '\n\nARTIFACT:\n' + current.content },
                        ], { jsonMode: true, temperature: 0.2 });
                    } catch (e) {
                        pushMessage({ id: uid(), kind: 'card', title: 'REVIEW ERROR', tone: 'error', lines: [String(e.message || e)], ts: stamp() });
                        return;
                    }
                    const score = Math.max(1, Math.min(10, Math.round(Number(rev.score) || (rev.decision === 'approve' ? 9 : 5))));
                    if (rev.decision === 'approve' && score >= 8) {
                        updateMessage(artId, { review: { decision: 'approve', issues: [], score } });
                        pushMessage({ id: uid(), kind: 'card', title: 'REVIEW APPROVED · ' + score + '/10', tone: 'ok', lines: ['Artifact passed the quality review.'], ts: stamp() });
                        return;
                    }
                    if (i === 2) {
                        updateMessage(artId, { review: { decision: 'approve', issues: [], score } });
                        pushMessage({ id: uid(), kind: 'card', title: 'REVIEW · ' + score + '/10 (MAX ITERATIONS)', tone: 'ok', lines: ['Reached 3 fix rounds. Delivering the best version.'], ts: stamp() });
                        return;
                    }
                    const issues = (rev.issues || []).slice(0, 5);
                    updateMessage(artId, { review: { decision: 'fix', issues } });
                    pushMessage({ id: uid(), kind: 'card', title: 'REVIEW FOUND ISSUES', tone: 'warn', lines: issues.length ? issues.map(s => '• ' + s) : ['• Unspecified quality issues'], ts: stamp() });
                    const improved = rev.improved && rev.improved.content;
                    if (!improved) {
                        pushMessage({ id: uid(), kind: 'card', title: 'FIX NOT PROVIDED', tone: 'warn', lines: ['Review requested fixes but returned no improved artifact. Delivering as-is.'], ts: stamp() });
                        return;
                    }
                    current = { filename: (rev.improved.filename || current.filename), language: current.language, content: improved };
                    updateMessage(artId, { content: improved, filename: current.filename, iterations: (i + 2) });
                    pushMessage({ id: uid(), kind: 'card', title: 'ITERATION ' + (i + 2) + ' APPLIED', tone: 'info', lines: ['Improved artifact generated from review feedback.'], ts: stamp() });
                }
                pushMessage({ id: uid(), kind: 'card', title: 'MAX ITERATIONS (3)', tone: 'warn', lines: ['Loop limit reached. Delivering the artifact as-is.'], ts: stamp() });
            };

            const maybeLearnLesson = async (directive, content) => {
                try {
                    const out = await brainCall([
                        { role: 'system', content: LESSON_SYSTEM },
                        { role: 'user', content: 'TASK:\n' + directive + '\n\nARTIFACT SNIPPET:\n' + content.slice(0, 1500) },
                    ], { jsonMode: true, temperature: 0.1 });
                    if (out && out.lesson) {
                        addLesson(out.lesson);
                        pushMessage({ id: uid(), kind: 'card', title: 'MEMORY UPDATED', tone: 'ok', lines: ['Learned: ' + out.lesson], ts: stamp() });
                    }
                } catch (e) {}
            };

            /* Pipeline brain: uses the GitHub Actions secrets in the background.
               The chat dispatches a run and streams the result back. No keys in the browser. */
            const fetchRunLog = async (runId, token) => {
                try {
                    const j = await fetch(API + '/actions/runs/' + runId + '/jobs', { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
                    const jd = await j.json();
                    const job = jd.jobs && jd.jobs[0];
                    if (!job) return [];
                    const lg = await fetch(API + '/actions/jobs/' + job.id + '/logs', { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
                    const txt = await lg.text();
                    return txt.split('\n').filter(l => l.includes('[System]') || l.includes('[Route]') || l.includes('[Warning]')).map(l => l.replace(/^.*?Z /, '').replace(/^\d{4}-\d{2}-\d{2}T[\d:.]*Z /, '').trim()).filter(Boolean).slice(-10);
                } catch (e) { return []; }
            };

            const extractReportReply = (txt) => {
                const idx = txt.indexOf('\n---\n');
                const body = idx >= 0 ? txt.slice(idx + 5) : txt;
                return body.trim();
            };

            const pipelineTurn = async (userText, atts) => {
                const prompt = await buildAttachmentPrompt(userText, atts);
                const token = remoteToken.trim();
                if (!token) {
                    pushMessage({ id: uid(), kind: 'card', title: 'ONE-TIME SETUP NEEDED', tone: 'warn', lines: ['Nexus thinks through the background pipeline so your API keys stay in GitHub secrets.', 'Open PIPELINE and paste your GitHub token once (fine-grained, Actions read/write). It is stored only in this browser.', 'No API keys are ever entered in the chat.'], ts: stamp() });
                    setShowRemote(true);
                    return;
                }
                setBusy(true);
                setProviderTag('PIPELINE');
                const thoughtId = uid();
                const started = Date.now();
                pushMessage({ id: thoughtId, kind: 'thought', secs: '...', lines: ['Dispatching to background pipeline (uses your GitHub secrets)...'], ts: stamp() });
                try {
                    const res = await fetch(API + '/actions/workflows/run_agent.yml/dispatches', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ref: 'main', inputs: { prompt, mode: 'chat' } }),
                    });
                    if (!res.ok) throw new Error('Dispatch HTTP ' + res.status);
                    let run = null;
                    for (let i = 0; i < 45; i++) {
                        await new Promise(r => setTimeout(r, 6000));
                        const rr = await fetch(API + '/actions/runs?event=workflow_dispatch&per_page=1', { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
                        const dd = await rr.json();
                        if (dd.workflow_runs && dd.workflow_runs.length) {
                            run = dd.workflow_runs[0];
                            const elapsed = Math.round((Date.now() - started) / 1000);
                            updateMessage(thoughtId, { lines: ['Pipeline run #' + run.run_number + ' in progress (' + elapsed + 's)...', 'Agent is thinking with your GitHub secrets.', 'This message will update when the run completes.'] });
                            if (run.status !== 'queued' && run.status !== 'in_progress') break;
                        }
                    }
                    if (!run) throw new Error('Timed out waiting for the pipeline run.');
                    const secs = ((Date.now() - started) / 1000).toFixed(1);
                    if (run.conclusion !== 'success') {
                        updateMessage(thoughtId, { secs, lines: ['Pipeline run #' + run.run_number + ' ' + (run.conclusion || 'failed') + '.', 'Check the run log for details.'] });
                        pushMessage({ id: uid(), kind: 'card', title: 'RUN ' + (run.conclusion || 'FAILED').toUpperCase(), tone: 'error', lines: ['Run #' + run.run_number + ' did not complete successfully. Open the run log to inspect.', run.html_url], ts: stamp() });
                        return;
                    }
                    const logLines = await fetchRunLog(run.id, token);
                    updateMessage(thoughtId, { secs, lines: logLines.length ? logLines : ['Pipeline run #' + run.run_number + ' completed successfully.'] });
                    setProviderTag('PIPELINE');
                    const rep = await fetch(PAGES_ROOT + '/output/latest_report.md', { cache: 'no-store' });
                    if (rep.ok) {
                        const reply = extractReportReply(await rep.text());
                        pushMessage({ id: uid(), role: 'agent', text: reply, ts: stamp() });
                    }
                    const man = await fetch(PAGES_ROOT + '/output/latest_manifest.json', { cache: 'no-store' });
                    if (man.ok) {
                        const m = await man.json();
                        const art = await fetch(PAGES_ROOT + '/output/latest_app.html', { cache: 'no-store' });
                        if (art.ok) {
                            const content = await art.text();
                            if (content && content.length > 20) {
                                pushMessage({ id: uid(), kind: 'artifact', filename: 'app_' + (m.timestamp || Date.now()) + '.html', lang: 'HTML', content, summary: m.provider + ' · ' + m.model + ' · ' + m.latency_ms + 'ms' + (m.review && m.review.applied ? ' · REVIEWED' : ''), iterations: [1], review: null, ts: stamp() });
                                setPreviewHtml(content);
                            }
                        }
                    }
                    setMemoryEpoch(e => e + 1);
                } catch (err) {
                    updateMessage(thoughtId, { secs: '0.0', lines: ['Pipeline call failed.'] });
                    pushMessage({ id: uid(), kind: 'card', title: 'PIPELINE ERROR', tone: 'error', lines: [String(err.message || err)], ts: stamp() });
                } finally {
                    setBusy(false);
                    setProviderTag('--');
                }
            };

            /* Hybrid routing: chat brain (Puter / keyed provider) for conversation,
               GitHub pipeline for heavy builds when it makes sense. */
            const isHeavyBuild = (t) => {
                const words = (t || '').trim().split(/\s+/).length;
                return words > 60 || /repo|repository|project|docker|database|backend|full-stack|saas|multi-file|architecture/i.test(t);
            };
            const chatProvider = () => { const c = loadBrain(); return (c.provider && PROVIDER_DEFS[c.provider]) ? c.provider : 'groq'; };

            const agentTurn = async (userText, atts) => {
                const usePuter = chatProvider() === 'puter';
                const heavy = isHeavyBuild(userText);
                if (!brainConfigured()) { await pipelineTurn(userText, atts); return; }
                if (usePuter && heavy && remoteToken.trim()) {
                    pushMessage({ id: uid(), kind: 'card', title: 'HEAVY BUILD → PIPELINE', tone: 'info', lines: ['This looks like a big multi-part project. Routing it to the GitHub pipeline (uses your secrets, commits artifacts, no browser credit spent).'], ts: stamp() });
                    await pipelineTurn(userText, atts);
                    return;
                }
                if (usePuter && heavy && !remoteToken.trim()) {
                    pushMessage({ id: uid(), kind: 'card', title: 'HEAVY BUILD DETECTED', tone: 'warn', lines: ['This is a big build. Add a GitHub token in PIPELINE to run it on the free background pipeline, or continue here with Puter (spends your Puter credits).'], ts: stamp() });
                }
                setBusy(true);
                const t0 = performance.now();
                const thoughtId = uid();
                pushMessage({ id: thoughtId, kind: 'thought', secs: '...', lines: [], ts: stamp() });
                try {
                    const hist = messagesRef.current
                        .filter(m => m.role)
                        .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }))
                        .slice(-12);
                    // Build the final user message: multimodal when images are attached
                    let finalContent = userText;
                    const images = (atts || []).filter(a => a.kind === 'image');
                    const textAtts = (atts || []).filter(a => a.kind === 'text');
                    if (textAtts.length) {
                        finalContent += '\n\n' + textAtts.map(a => '[Attached file: ' + a.name + ']\n```\n' + a.text.slice(0, 8000) + '\n```').join('\n\n');
                    }
                    if (images.length) {
                        finalContent = [
                            { type: 'text', text: finalContent || '(image attached)' },
                            ...images.map(a => ({ type: 'image_url', image_url: { url: a.dataUrl } })),
                        ];
                    }
                    const messagesPayload = [
                        { role: 'system', content: buildSystemPrompt() },
                        ...hist,
                        { role: 'user', content: finalContent },
                    ];
                    let out;
                    if (usePuter) {
                        // Stream the reply token-by-token: a live "typing" bubble
                        // that resolves into the final answer.
                        const liveId = uid();
                        pushMessage({ id: liveId, role: 'agent', text: '', streaming: true, ts: stamp() });
                        let buf = '';
                        out = await puterStream(messagesPayload, {
                            jsonMode: true,
                            onToken: (chunk) => {
                                buf += chunk;
                                const n = Math.min(3, 1 + Math.floor(buf.length / 400));
                                updateMessage(liveId, { text: '▊'.repeat(n), streaming: true });
                            },
                        });
                        const replyText = out && out.reply ? out.reply : (out && typeof out === 'string' ? out : 'Done.');
                        setMessages(prev => prev.map(m => m.id === liveId ? { ...m, text: replyText, streaming: false } : m));
                    } else {
                        out = await brainCall(messagesPayload, { jsonMode: true, temperature: 0.4 });
                        if (out.reply) pushMessage({ id: uid(), role: 'agent', text: out.reply, ts: stamp() });
                    }
                    const secs = ((performance.now() - t0) / 1000).toFixed(1);
                    updateMessage(thoughtId, { secs, lines: out.reasoning || ['Classifying directive...', 'Resolving context...', 'Formulating response...'] });
                    setProviderTag(lastBrainProvider || (loadBrain().provider ? loadBrain().provider.toUpperCase() : '--'));
                    if (out.reply) pushMessage({ id: uid(), role: 'agent', text: out.reply, ts: stamp() });
                    if (out.status === 'clarify' && Array.isArray(out.questions) && out.questions.length) {
                        pushMessage({ id: uid(), kind: 'questions', items: out.questions.slice(0, 4), ts: stamp() });
                    }
                    // Multi-file support: out.files = {name: content} OR out.artifact (single)
                    const built = [];
                    if (out.artifact && out.artifact.content) built.push(out.artifact);
                    if (out.files && typeof out.files === 'object') {
                        for (const [fname, fcontent] of Object.entries(out.files)) {
                            if (fcontent && String(fcontent).trim().length > 10) {
                                built.push({ filename: fname, language: (fname.split('.').pop() || 'txt').toLowerCase(), content: String(fcontent) });
                            }
                        }
                    }
                    if (built.length) {
                        const primary = built.find(a => /\.html?$/.test(a.filename || '')) || built[0];
                        for (const art of built) {
                            const artId = uid();
                            pushMessage({ id: artId, kind: 'artifact', filename: art.filename || 'app.html', lang: (art.language || 'html').toUpperCase(), content: art.content, summary: art.summary || '', iterations: [1], review: null, ts: stamp() });
                            if (art === primary) {
                                await runReviewLoop(artId, userText, art);
                            }
                        }
                        const finalMsg = messagesRef.current.find(m => m.id && m.kind === 'artifact' && (m.content || '') === primary.content);
                        if (finalMsg && finalMsg.content) maybeLearnLesson(userText, finalMsg.content);
                    }
                } catch (err) {
                    updateMessage(thoughtId, { secs: '0.0', lines: ['Engine call failed.'] });
                    pushMessage({ id: uid(), kind: 'card', title: 'ENGINE ERROR', tone: 'error', lines: [String(err.message || err)], ts: stamp() });
                } finally {
                    setBusy(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (busy) return;
                const text = chatInput.trim();
                if (!text && !attachments.length) return;
                const atts = attachments;
                setChatInput('');
                setAttachments([]);
                pushMessage({ id: uid(), role: 'user', text: text || '(attachment only)', attachments: atts, ts: stamp() });
                agentTurn(text, atts);
            };

            // Tap-to-answer: the selected option is sent immediately so Nexus
            // sees the answer in context and continues the thread.
            const handleQuickAnswer = (q) => {
                if (busy) return;
                pushMessage({ id: uid(), role: 'user', text: q, ts: stamp() });
                agentTurn(q);
            };

            /* ---- settings ---- */
            const saveBrainCfg = () => {
                saveBrain(brainCfg);
                setShowSettings(false);
                pushMessage({ id: uid(), kind: 'card', title: 'BRAIN CONFIGURED', tone: 'ok', lines: ['Mode: ' + (PROVIDER_DEFS[brainCfg.provider] || {}).label + (brainCfg.model ? ' · Model: ' + brainCfg.model : ''), 'Everything is saved in this browser - no need to re-enter it.'], ts: stamp() });
            };
            const testBrain = async () => {
                setTestResult('TESTING...');
                try {
                    const out = await brainCall([{ role: 'user', content: 'Reply with JSON: {"ok": true}' }], { jsonMode: true, temperature: 0 });
                    setTestResult('CONNECTION OK via ' + (lastBrainProvider || '?') + ': ' + JSON.stringify(out));
                } catch (e) { setTestResult('FAILED: ' + (e.message || e)); }
            };

            /* ---- remote pipeline ---- */
            const handleRemoteDispatch = async () => {
                if (!remoteToken.trim() || !remoteDirective.trim() || remoteBusy) return;
                setRemoteBusy(true); setRemoteStatus('DISPATCHING...');
                try {
                    const res = await fetch(API + '/actions/workflows/run_agent.yml/dispatches', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + remoteToken.trim(), 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ref: 'main', inputs: { prompt: remoteDirective.trim(), mode: 'full' } }),
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    try { localStorage.setItem('nexus_remote_token', remoteToken.trim()) } catch (e) {}
                    setRemoteStatus('RUN STARTED - TRACKING...');
                    let run = null;
                    for (let i = 0; i < 10; i++) {
                        await new Promise(r => setTimeout(r, 4000));
                        const r2 = await fetch(API + '/actions/runs?event=workflow_dispatch&per_page=1', { headers: { 'Authorization': 'Bearer ' + remoteToken.trim(), 'Accept': 'application/vnd.github+json' } });
                        const d = await r2.json();
                        if (d.workflow_runs && d.workflow_runs.length) {
                            run = d.workflow_runs[0];
                            if (run.status !== 'queued' && run.status !== 'in_progress') break;
                            setRemoteStatus('RUN #' + run.run_number + ' - ' + run.status.toUpperCase());
                        }
                    }
                    if (run) {
                        setRemoteStatus('RUN #' + run.run_number + ' - ' + (run.status === 'completed' ? run.conclusion.toUpperCase() : run.status.toUpperCase()));
                        setMemoryEpoch(e => e + 1);
                    }
                } catch (e) { setRemoteStatus('ERROR: ' + e.message); }
                finally { setRemoteBusy(false); }
            };

            const memoryLessons = (memoryData && memoryData.lessons) ? memoryData.lessons : [];
            const chatMemory = loadChatMemory();

            const renderMessage = (m) => {
                if (m.kind === 'thought') {
                    const open = expandedThought === m.id;
                    return (
                        <div className="animate-fadeup">
                            <button onClick={() => setExpandedThought(open ? null : m.id)} className="flex items-center gap-2 text-[11px] font-mono text-stone-500 hover:text-ember-600 transition-colors group">
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" className="text-ember-500"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.8" /><path d="M12 7v5l3 2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" /></svg>
                                Thought for {m.secs}s
                                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" className={'transition-transform ' + (open ? 'rotate-180' : '') + ' text-stone-400'}><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" /></svg>
                                <span className="text-[9px] text-stone-400 group-hover:text-ember-600">{open ? 'HIDE' : 'VIEW REASONING'}</span>
                            </button>
                            {open && (
                                <div className="mt-1.5 ml-1 rounded-xl border border-cream-300 bg-white px-3.5 py-3 space-y-1.5">
                                    <div className="text-[8px] font-mono tracking-[0.18em] text-stone-400">REASONING TRACE</div>
                                    {(m.lines || []).map((l, i) => <div key={i} className="text-[11px] font-mono leading-relaxed text-stone-600">▸ {l}</div>)}
                                </div>
                            )}
                        </div>
                    );
                }
                if (m.kind === 'questions') {
                    return (
                        <div className="animate-fadeup">
                            <div className="text-[9px] font-mono text-stone-400 mb-1.5 tracking-wider">TAP AN ANSWER - IT SENDS AUTOMATICALLY</div>
                            <div className="flex flex-wrap gap-2">
                                {(m.items || []).map((q, i) => (
                                    <button key={i} onClick={() => handleQuickAnswer(q)} className="text-[11px] font-mono border border-cream-400 bg-white text-stone-600 hover:text-ember-600 hover:border-ember-300 px-3.5 py-2 rounded-full transition-all shadow-soft">
                                        {q}
                                    </button>
                                ))}
                            </div>
                        </div>
                    );
                }
                if (m.kind === 'card') {
                    const toneCls = m.tone === 'ok' ? 'border-emerald-200 bg-emerald-50/70 text-emerald-800'
                        : m.tone === 'warn' ? 'border-amber-200 bg-amber-50/70 text-amber-800'
                        : m.tone === 'error' ? 'border-red-200 bg-red-50/70 text-red-700'
                        : 'border-cream-300 bg-white text-stone-600';
                    return (
                        <div className={'animate-fadeup rounded-xl border px-3.5 py-2.5 ' + toneCls}>
                            <div className="text-[8px] font-mono tracking-[0.18em] opacity-70 mb-1">{m.title}</div>
                            <div className="text-[11px] leading-relaxed space-y-0.5">{(m.lines || []).map((l, i) => <div key={i}>{l}</div>)}</div>
                        </div>
                    );
                }
                if (m.kind === 'artifact') {
                    return (
                        <div className="rounded-2xl border border-cream-300 bg-white shadow-soft overflow-hidden animate-fadeup">
                            <div className="flex items-center gap-2.5 px-3.5 py-2 border-b border-cream-200 bg-cream-50">
                                <span className="text-[10px] font-mono text-stone-700 truncate flex-1">{m.filename}</span>
                                <span className="text-[8px] font-mono px-1.5 py-0.5 rounded bg-ember-100 text-ember-700 tracking-wider">{m.lang}</span>
                                <span className="text-[9px] font-mono text-stone-400">×{(m.iterations || 1)}</span>
                                {m.review && m.review.decision === 'approve' && <span className="text-[8px] font-mono px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700">APPROVED</span>}
                                <span className="flex-1"></span>
                                <button onClick={() => downloadBlob(m.content, m.filename)} className="text-[9px] font-mono text-ember-600 hover:text-ember-700 border border-ember-200 bg-ember-50 px-2 py-1 rounded-md">DOWNLOAD</button>
                                <button onClick={() => { setPreviewHtml(m.content); setActiveView('preview'); }} className="text-[9px] font-mono text-stone-500 hover:text-ember-600">PREVIEW</button>
                                <button onClick={async () => {
                                    try {
                                        const url = await saveToRepo(m.filename, m.content);
                                        pushMessage({ id: uid(), kind: 'card', title: 'SAVED TO REPO', tone: 'ok', lines: [url], ts: stamp() });
                                    } catch (e) { pushMessage({ id: uid(), kind: 'card', title: 'SAVE FAILED', tone: 'error', lines: [String(e.message || e)], ts: stamp() }); }
                                }} className="text-[9px] font-mono text-stone-400 hover:text-ember-600">SAVE↗</button>
                            </div>
                            {m.summary && <div className="px-3.5 py-1.5 border-b border-cream-200 text-[10px] text-stone-500 bg-cream-50/60">{m.summary}</div>}
                            <pre className="px-3.5 py-2.5 font-mono text-[10.5px] leading-relaxed text-stone-600 max-h-64 overflow-y-auto custom-scrollbar whitespace-pre-wrap">{m.content || '<!-- no content -->'}</pre>
                        </div>
                    );
                }
                if (m.role === 'user') {
                    return (
                        <div className="flex justify-end animate-fadeup">
                            <div className="max-w-[85%] bg-white border border-cream-300 rounded-2xl rounded-br-md px-4 py-3 shadow-soft">
                                <div className="text-[9px] font-mono text-stone-400 mb-1 tracking-wider">YOU · {m.ts}</div>
                                {(m.attachments || []).length > 0 && (
                                    <div className="flex flex-wrap gap-1.5 mb-2">
                                        {(m.attachments || []).map(a => (
                                            a.kind === 'image'
                                                ? <img key={a.id} src={a.dataUrl} alt={a.name} className="h-16 rounded-lg border border-cream-300 object-cover" />
                                                : a.kind === 'video'
                                                ? <span key={a.id} className="inline-flex items-center gap-1 text-[9px] font-mono border border-cream-300 bg-cream-50 rounded-md px-2 py-1 text-stone-500"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M23 7l-7 5 7 5V7z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><rect x="1" y="5" width="15" height="14" rx="2" stroke="currentColor" strokeWidth="1.8"/></svg>{a.name} · video</span>
                                                : <span key={a.id} className="inline-flex items-center gap-1 text-[9px] font-mono border border-cream-300 bg-cream-50 rounded-md px-2 py-1 text-stone-500"><svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>{a.name}</span>
                                        ))}
                                    </div>
                                )}
                                {m.text !== '(attachment only)' && <div className="text-[13px] leading-relaxed text-stone-700">{m.text}</div>}
                            </div>
                        </div>
                    );
                }
                return (
                    <div className="animate-fadeup">
                        <div className="text-[9px] font-mono text-stone-400 mb-1 tracking-wider">{m.role === 'system' ? 'SYSTEM · ' + m.ts : 'NEXUS · ' + m.ts}</div>
                        <div className={m.role === 'system' ? 'text-[12px] leading-relaxed text-stone-400' : 'space-y-0.5'}>
                            {m.role === 'system' ? <span>{m.text}</span> : renderRich(m.text || '')}
                        </div>
                    </div>
                );
            };

            const statusPill = busy
                ? { label: brainConfigured() ? 'THINKING' : 'PIPELINE', cls: 'text-ember-700 border-ember-300 bg-ember-50' }
                : { label: 'STANDBY', cls: 'text-stone-500 border-cream-400 bg-white' };

            return (
                <div className="h-screen w-full overflow-hidden" style={{ height: '100dvh' }}>
                    <ParticleCanvas />
                    <div className="app-layer flex flex-col h-full">

                        {/* ===== TOP BAR ===== */}
                        <header className="glass border-b border-cream-300 shrink-0 z-30">
                            <div className="flex items-center gap-2.5 px-4 h-14">
                                <div className="w-8 h-8 rounded-xl brand-gradient shadow-soft flex items-center justify-center shrink-0">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" className="text-white"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" /><path d="M12 22V12M3 7l9 5 9-5" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" opacity="0.6" /></svg>
                                </div>
                                <div className="min-w-0">
                                    <div className="flex items-center gap-2">
                                        <span className="font-semibold text-sm tracking-[0.18em] text-stone-800">NEXUS</span>
                                        <span className="text-[8px] font-mono px-1.5 py-0.5 bg-ember-50 border border-ember-200 rounded-md text-ember-600 tracking-wider">V6.0</span>
                                    </div>
                                    <div className="text-[9px] text-stone-400 font-mono hidden sm:block">CHAT-NATIVE AUTONOMOUS AGENT</div>
                                </div>
                                <div className="flex-1"></div>

                                <div className={`flex items-center gap-2 px-3 py-1 rounded-full border text-[9px] font-mono tracking-wider transition-all ${statusPill.cls} ${busy ? 'glow-active' : ''}`}>
                                    <span className={'w-1.5 h-1.5 rounded-full ' + (busy ? 'bg-ember-500 animate-pulse' : 'bg-stone-300')}></span>
                                    {statusPill.label}
                                </div>

                                <button onClick={() => setShowSettings(true)} className="text-[10px] font-mono border border-cream-400 bg-white text-stone-600 hover:text-ember-600 hover:border-ember-300 px-3 py-2 rounded-lg tracking-wider transition-all" title="Optional fast brain">
                                    BRAIN
                                </button>
                                <button onClick={exportChat} className="hidden md:block text-[10px] font-mono border border-cream-400 bg-white text-stone-600 hover:text-ember-600 hover:border-ember-300 px-3 py-2 rounded-lg tracking-wider transition-all">EXPORT</button>
                                <button onClick={clearSession} title="Clear saved chat" className="hidden md:flex w-8 h-8 items-center justify-center rounded-lg border border-cream-400 bg-white text-stone-400 hover:text-ember-600 hover:border-ember-300 transition-all">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                                </button>
                                <button onClick={() => setShowRemote(true)} className="hidden md:block text-[10px] font-mono btn-primary text-white px-3.5 py-2 rounded-lg tracking-wider transition-all shadow-soft">PIPELINE</button>
                            </div>
                            <div className="md:hidden flex border-t border-cream-200">
                                {[['chat', 'CHAT'], ['preview', 'VIEW'], ['files', 'FILES'], ['runs', 'RUNS'], ['memory', 'MEM']].map(([id, label]) => (
                                    <button key={id} onClick={() => setActiveView(id)} className={'flex-1 py-2 text-[9px] font-mono tracking-wider transition-colors ' + (activeView === id ? 'text-ember-600 bg-ember-50' : 'text-stone-400')}>{label}</button>
                                ))}
                            </div>
                        </header>

                        {/* ===== BODY ===== */}
                        <div className="flex flex-1 min-h-0">

                            {/* Sidebar (desktop) */}
                            <aside className="hidden md:flex w-[250px] xl:w-[280px] flex-col border-r border-cream-300 glass shrink-0">
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-4">
                                    <div>
                                        <div className="flex items-center justify-between px-1 mb-1.5">
                                            <span className="text-[9px] font-mono tracking-[0.18em] text-stone-400">WORKSPACE</span>
                                            <div className="flex items-center gap-2">
