<body>
    <div id="root"></div>
    <script>
        // PWA: register service worker (offline shell) + capture install prompt
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
        }
        let deferredInstall = null;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; window.dispatchEvent(new CustomEvent('nexus-install-ready')); });
        window.addEventListener('appinstalled', () => { deferredInstall = null; window.dispatchEvent(new CustomEvent('nexus-installed')); });
        // Wake lock: keep the screen on while Nexus is working
        let wakeLockRef = null;
        window.__nexusWake = {
            request: async () => { try { if (navigator.wakeLock) wakeLockRef = await navigator.wakeLock.request('screen'); } catch (e) {} },
            release: () => { try { if (wakeLockRef) wakeLockRef.release(); } catch (e) {} wakeLockRef = null; }
        };
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && window.__nexusBusy) window.__nexusWake.request(); });
    </script>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const REPO = 'Idkwhattonametsbro/Nexus';
        const PAGES_ROOT = 'https://idkwhattonametsbro.github.io/Nexus';
        const ACTIONS_URL = 'https://github.com/' + REPO + '/actions/workflows/run_agent.yml';
        const API = 'https://api.github.com/repos/' + REPO;

        const QUICK_TASKS = [
            'Build me a habit tracker with streaks',
            'Make a pomodoro timer app',
            'Build a personal portfolio page',
            'What can you do?',
        ];

        function stamp() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
        function uid() { return Math.random().toString(36).slice(2, 9); }

        /* ================= BRAIN ENGINE (browser-native agent) ================= */
        const BRAIN_KEY = 'nexus_brain';
        const MEMORY_KEY = 'nexus_chat_memory';
        const HISTORY_KEY = 'nexus_chat_history';
        const CHATS_KEY = 'nexus_chats';

        function loadChats() { try { return JSON.parse(localStorage.getItem(CHATS_KEY)) || [] } catch (e) { return [] } }
        function saveChats(chats) {
            try {
                const slim = chats.map(c => ({
                    id: c.id, title: c.title, created: c.created, memory: c.memory || {},
                    messages: (c.messages || []).map(m => {
                        const s = { id: m.id, role: m.role, kind: m.kind, ts: m.ts, text: m.text && m.text.slice(0, 20000) };
                        if (m.kind === 'thought') s.lines = (m.lines || []).slice(0, 8);
                        if (m.kind === 'questions') s.items = (m.items || []).slice(0, 4);
                        if (m.kind === 'artifact') { s.filename = m.filename; s.lang = m.lang; s.summary = m.summary; s.iterations = m.iterations; s.review = m.review; s.content = (m.content || '').slice(0, 30000); }
                        if (m.kind === 'card') { s.title = m.title; s.tone = m.tone; }
                        if (m.attachments) s.attachments = m.attachments.map(a => a.kind === 'image' ? { id: a.id, kind: 'image', name: a.name, dataUrl: (a.dataUrl || '').slice(0, 400000) } : { id: a.id, kind: a.kind, name: a.name });
                        return s;
                    }).slice(-60),
                }));
                localStorage.setItem(CHATS_KEY, JSON.stringify(slim));
            } catch (e) {}
        }

        const PROVIDER_DEFS = {
            auto: { label: 'AUTO · best available (Puter → Gemini → Groq → …)', defaultModel: '' },
            puter: { label: 'Puter · Claude Fable 5 (browser sign-in)', defaultModel: 'claude-fable-5', models: ['claude-fable-5', 'claude-opus-5', 'claude-sonnet-5', 'claude-sonnet-4.6', 'gpt-5.5', 'gpt-5.4', 'gemini-3.1-flash-lite', 'deepseek-r1'] },
            gemini: { url: 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions', defaultModel: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash (free, vision)' },
            groq: { url: 'https://api.groq.com/openai/v1/chat/completions', defaultModel: 'openai/gpt-oss-120b', label: 'Groq (free, vision)' },
            github: { url: 'https://models.inference.ai.azure.com/chat/completions', defaultModel: 'gpt-4.1-mini', label: 'GitHub Models (free)' },
            cerebras: { url: 'https://api.cerebras.ai/v1/chat/completions', defaultModel: 'llama-3.3-70b', label: 'Cerebras (free)' },
            openrouter: { url: 'https://openrouter.ai/api/v1/chat/completions', defaultModel: 'meta-llama/llama-3.3-70b-instruct:free', label: 'OpenRouter' },
            deepseek: { url: 'https://api.deepseek.com/chat/completions', defaultModel: 'deepseek-v4-flash', label: 'DeepSeek' },
            pollinations: { url: 'https://gen.pollinations.ai/v1/chat/completions', defaultModel: 'openai', label: 'Pollinations · FREE, NO KEY · 100+ models', noKey: true },
        };

        const BRAIN_ORDER = ['puter', 'gemini', 'groq', 'github', 'cerebras', 'openrouter', 'deepseek', 'pollinations'];

        /* ---- Multi-model chain: Puter (if signed in) -> saved keys -> keyless Pollinations (auto failover) ---- */
        let lastBrainProvider = null;
        let lastBrainFallback = null;
        function providerKey(p) {
            const def = PROVIDER_DEFS[p];
            if (def && def.noKey) return 'pollinations'; // keyless
            const cfg = loadBrain();
            if (cfg.keys && cfg.keys[p]) return cfg.keys[p];
            if (p === cfg.provider && cfg.key) return cfg.key; // legacy single-key
            return '';
        }
        function configuredProviders() {
            const cfg = loadBrain();
            const chosen = (cfg.provider && PROVIDER_DEFS[cfg.provider]) ? cfg.provider : 'auto';
            const pool = BRAIN_ORDER.filter(p => {
                if (p === 'puter') return true; // verified live (no popup)
                if (PROVIDER_DEFS[p] && PROVIDER_DEFS[p].noKey) return true; // keyless
                return !!providerKey(p);
            });
            if (chosen !== 'auto') return pool.filter(p => p === chosen);
            return pool;
        }
        async function puterAvailable() {
            try {
                await loadPuterScript();
                return !!(window.puter && window.puter.auth && window.puter.auth.isSignedIn && window.puter.auth.isSignedIn());
            } catch (e) { return false; }
        }
        function loadBrain() { try { return JSON.parse(localStorage.getItem(BRAIN_KEY)) || {} } catch (e) { return {} } }
        function saveBrain(c) { try { localStorage.setItem(BRAIN_KEY, JSON.stringify(c)) } catch (e) {} }
        function brainConfigured() {
            const c = loadBrain();
            if (c.provider === 'puter') return true;
            if (c.keys) { for (const p of BRAIN_ORDER) if (c.keys[p]) return true; }
            return !!(c.key && c.key.trim());
        }

        function loadChatMemory() { try { return JSON.parse(localStorage.getItem(MEMORY_KEY)) || [] } catch (e) { return [] } }
        function addLesson(l) { const arr = loadChatMemory(); arr.push(l); try { localStorage.setItem(MEMORY_KEY, JSON.stringify(arr.slice(-10))) } catch (e) {} }

        function parseJson(content) {
            let c = (content || '').trim();
            try { return JSON.parse(c); } catch (e) {}
            const m = c.match(/```(?:json)?\s*([\s\S]*?)```/);
            if (m) { try { return JSON.parse(m[1].trim()) } catch (e) {} }
            const s = c.indexOf('{'), e = c.lastIndexOf('}');
            if (s >= 0 && e > s) { try { return JSON.parse(c.slice(s, e + 1)) } catch (_) {} }
            throw new Error('Model did not return valid JSON.');
        }

        /* ---- Puter.js bridge (browser-only, user-pays: Claude Fable 5 / Opus 5 / etc.) ---- */
        function loadPuterScript() {
            return new Promise((resolve, reject) => {
                if (window.puter && window.puter.ai) return resolve();
                const s = document.createElement('script');
                s.src = 'https://js.puter.com/v2/';
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('Failed to load the Puter SDK (check connection).'));
                document.head.appendChild(s);
            });
        }
        async function ensurePuter() {
            await loadPuterScript();
            if (window.puter.auth && !window.puter.auth.isSignedIn()) {
                await window.puter.auth.signIn(); // popup; must come from a user gesture
            }
        }
        async function puterBrainCall(messages, opts = {}) {
            await ensurePuter();
            const cfg = loadBrain();
            const def = PROVIDER_DEFS.puter;
            const model = cfg.model && cfg.model.trim() ? cfg.model.trim() : def.defaultModel;
            // Extract a possible image from the last multimodal user message
            let imageUrl = null;
            let msgs = messages;
            const last = messages[messages.length - 1];
            if (last && Array.isArray(last.content)) {
                const img = last.content.find(p => p.type === 'image_url');
                if (img) imageUrl = img.image_url.url;
                const txt = last.content.filter(p => p.type === 'text').map(p => p.text).join('\n');
                msgs = [...messages.slice(0, -1), { role: 'user', content: txt }];
            }
            const chatArgs = [msgs, { model }];
            if (imageUrl) chatArgs.splice(1, 0, imageUrl);
            let resp;
            try {
                resp = await window.puter.ai.chat(...chatArgs);
            } catch (err) {
                const code = String((err && (err.code || err.error)) || '');
                const msg = String((err && (err.message || err.error)) || err);
                if (/insufficient_funds|usage-limited|402/i.test(code + ' ' + msg)) {
                    throw new Error('Puter credit limit reached. Top up at puter.com or switch provider in BRAIN - the GitHub pipeline keeps working automatically.');
                }
                throw new Error('Puter error: ' + msg.slice(0, 120));
            }
            let text = '';
            const content = resp && resp.message && resp.message.content;
            if (Array.isArray(content)) text = content.map(p => (p && p.text) || '').join('');
            else if (typeof content === 'string') text = content;
            else if (resp && typeof resp.text === 'string') text = resp.text;
            else text = String(resp || '');
            return opts.jsonMode ? parseJson(text) : text;
        }
        async function keyedBrainCall(messages, opts, provider) {
            const def = PROVIDER_DEFS[provider];
            const cfg = loadBrain();
            const model = cfg.model && cfg.model.trim() ? cfg.model.trim() : def.defaultModel;
            const key = providerKey(provider);
            const headers = (PROVIDER_DEFS[provider] && PROVIDER_DEFS[provider].noKey)
                ? { 'Content-Type': 'application/json' }
                : { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' };
            if (provider === 'openrouter') { headers['HTTP-Referer'] = window.location.origin; headers['X-Title'] = 'Nexus Workspace'; }
            const body = { model, messages, temperature: opts.temperature || 0.4 };
            if (opts.jsonMode) body.response_format = { type: 'json_object' };
            let res;
            const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            if (window.__nexusStopRef) window.__nexusStopRef.current = ctrl;
            try {
                res = await fetch(def.url, { method: 'POST', headers, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined });
            } catch (e) {
                if (e && e.name === 'AbortError') throw new Error('STOPPED');
                throw e;
            }
            if (!res.ok) {
                const txt = await res.text();
                if (res.status === 400 && opts.jsonMode) {
                    delete body.response_format;
                    res = await fetch(def.url, { method: 'POST', headers, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined });
                    if (!res.ok) throw new Error('API ' + res.status + ': ' + txt.slice(0, 160));
                } else {
                    throw new Error('API ' + res.status + ': ' + txt.slice(0, 200));
                }
            }
            if (window.__nexusStopRef) window.__nexusStopRef.current = null;
            const data = await res.json();
            const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
            if (!content) throw new Error('Empty response from model.');
            return opts.jsonMode ? parseJson(content) : content;
        }
        function isLimitError(msg) {
            return /credit limit|usage-limited|insufficient_funds|rate limit|429|402|quota|too many requests/i.test(String(msg || ''));
        }
        async function brainCall(messages, opts = {}) {
            const cfg = loadBrain();
            const chosen = (cfg.provider && PROVIDER_DEFS[cfg.provider]) ? cfg.provider : 'auto';
            const pool = configuredProviders();
            if (!pool.length) throw new Error('No brain configured. Open BRAIN and sign in with Puter or add an API key.');
            const errors = [];
            for (const p of pool) {
                try {
                    if (p === 'puter') {
                        if (!(await puterAvailable())) { errors.push('Puter: not signed in'); continue; }
                        const r = await puterBrainCall(messages, opts);
                        lastBrainProvider = 'PUTER';
                        return r;
                    }
                    const r = await keyedBrainCall(messages, opts, p);
                    lastBrainProvider = p.toUpperCase();
                    return r;
                } catch (e) {
                    const msg = (e && e.message) || String(e);
                    errors.push(p + ': ' + msg);
                    if (chosen !== 'auto') {
                        // Pinned provider hit a limit -> fall back through the auto pool once
                        if (isLimitError(msg)) {
                            const autoPool = BRAIN_ORDER.filter(q => q !== p && (q === 'puter' || providerKey(q)));
                            for (const q of autoPool) {
                                try {
                                    let r;
                                    if (q === 'puter') {
                                        if (!(await puterAvailable())) continue;
                                        r = await puterBrainCall(messages, opts);
                                        lastBrainProvider = 'PUTER';
                                    } else {
                                        r = await keyedBrainCall(messages, opts, q);
                                        lastBrainProvider = q.toUpperCase();
                                    }
                                    lastBrainFallback = { from: p, to: q };
                                    return r;
                                } catch (e2) { errors.push(q + ': ' + ((e2 && e2.message) || e2)); }
                            }
                        }
                        throw e;
                    }
                }
            }
            throw new Error('All brains failed: ' + errors.join(' | '));
        }


        /* ================= REAL TOOLS (agent can call these) ================= */
        const TOOL_DEFS = [
            { name: 'web_search', desc: 'Search the web for current information. Returns titles and snippets.', args: { query: 'string' } },
            { name: 'read_repo_file', desc: 'Read a file from the Nexus GitHub repository (public).', args: { path: 'string' } },
            { name: 'list_repo', desc: 'List files in the Nexus repository.', args: {} },
            { name: 'save_to_repo', desc: 'Save a file to the Nexus repository. Needs the GitHub token from the PIPELINE modal.', args: { path: 'string', content: 'string' } },
            { name: 'fetch_url', desc: 'Fetch a URL and return its text content.', args: { url: 'string' } },
            { name: 'test_html', desc: 'Sanity-test HTML/JS code (parse + syntax + external deps). Returns PASS or FAIL with details.', args: { code: 'string' } },
        ];
        /* ================= MCP CLIENT (Model Context Protocol, remote servers) ================= */
        const MCP_KEY = 'nexus_mcp_servers';
        const DEFAULT_MCP_SERVERS = [
            { name: 'github-mcp', url: 'https://api.githubcopilot.com/mcp/', note: 'GitHub Copilot MCP (needs auth)' },
        ];
        function loadMcpServers() { try { return JSON.parse(localStorage.getItem(MCP_KEY)) || [] } catch (e) { return [] } }
        function saveMcpServers(list) { try { localStorage.setItem(MCP_KEY, JSON.stringify(list)) } catch (e) {} }
        async function mcpRpc(serverUrl, method, params) {
            const body = JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method, params: params || {} });
            const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream' };
            try {
                if (window.puter && window.puter.net && window.puter.auth && window.puter.auth.isSignedIn && window.puter.auth.isSignedIn()) {
                    const r = await window.puter.net.fetch(serverUrl, { method: 'POST', headers, body });
                    const t = await r.text();
                    try { return JSON.parse(t); } catch (e) { return { content: [{ type: 'text', text: t.slice(0, 4000) }] }; }
                }
            } catch (e) {}
            const r = await fetch(serverUrl, { method: 'POST', headers, body });
            if (!r.ok) throw new Error('MCP HTTP ' + r.status);
            const t = await r.text();
            try { return JSON.parse(t); } catch (e) { return { content: [{ type: 'text', text: t.slice(0, 4000) }] }; }
        }
        async function mcpCall(a, ctx) {
            const name = String(a.server || '');
            const servers = loadMcpServers();
            const srv = servers.find(x => x.name === name);
            if (!srv) return '[mcp_call: unknown server "' + name + '". Use mcp_connect to add one, or mcp_list to see connected servers.]';
            const tool = String(a.tool || '');
            const args = a.args || {};
            try {
                const res = await mcpRpc(srv.url, 'tools/call', { name: tool, arguments: args });
                const content = res.result && res.result.content;
                if (Array.isArray(content)) {
                    return content.map(c => c.text || JSON.stringify(c)).join('\n').slice(0, 4000);
                }
                if (res.error) return '[MCP error: ' + JSON.stringify(res.error).slice(0, 300) + ']';
                return JSON.stringify(res).slice(0, 4000);
            } catch (e) { return '[mcp_call failed: ' + (e.message || e) + ']'; }
        }
        async function mcpListTools(a) {
            const servers = loadMcpServers();
            if (!servers.length) return '[No MCP servers connected. Use mcp_connect with a server URL, e.g. a public streamable-HTTP MCP endpoint. The MCP catalog at github.com/microsoft/mcp lists community servers.]';
            const out = [];
            for (const srv of servers) {
                try {
                    const res = await mcpRpc(srv.url, 'tools/list', {});
                    const tools = res.result && res.result.tools;
                    if (Array.isArray(tools)) out.push('Server ' + srv.name + ' (' + srv.url + '):\n' + tools.map(t => '- ' + t.name + ': ' + (t.description || '').slice(0, 120)).join('\n'));
                    else out.push('Server ' + srv.name + ': ' + JSON.stringify(res).slice(0, 300));
                } catch (e) { out.push('Server ' + srv.name + ': unreachable (' + (e.message || e) + ')'); }
            }
            return out.join('\n\n').slice(0, 5000);
        }
        async function mcpConnect(a) {
            const name = String(a.name || '').trim();
            const url = String(a.url || '').trim();
            if (!name || !url) return '[mcp_connect: need name + url]';
            const servers = loadMcpServers();
            if (servers.find(x => x.name === name)) return '[mcp_connect: server "' + name + '" already exists]';
            servers.push({ name, url, note: a.note || '' });
            saveMcpServers(servers);
            return 'Connected MCP server "' + name + '" at ' + url + '. Use mcp_list to see its tools, then mcp_call.';
        }

        /* ================= SCHEDULER ================= */
        const SCHED_KEY = 'nexus_schedule';
        function loadSchedules() { try { return JSON.parse(localStorage.getItem(SCHED_KEY)) || [] } catch (e) { return [] } }
        function saveSchedules(list) { try { localStorage.setItem(SCHED_KEY, JSON.stringify(list)) } catch (e) {} }
        function notify(title, body) {
            try {
                if (!('Notification' in window)) return;
                if (Notification.permission === 'granted') new Notification(title, { body });
                else if (Notification.permission !== 'denied') Notification.requestPermission();
            } catch (e) {}
        }

        /* ================= EXTERNAL KNOWLEDGE TOOLS (public-apis / build-your-own-x / skills) ================= */
        const KEYLESS_APIS = {
            github_search: { url: 'https://api.github.com/search/repositories', desc: 'Search GitHub repos (no key, ~60 req/hr)', params: { q: 'query' } },
            github_user: { url: 'https://api.github.com/users/', desc: 'GitHub user profile by username', params: { username: 'name' } },

        /* ================= RICH TEXT RENDERER (clean, professional replies) ================= */
        function Inline({ text }) {
            const parts = String(text || '').split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*]+\*)/g);
            return parts.map((p, i) => {
                if (/^\*\*[^*]+\*\*$/.test(p)) return <strong key={i} className="font-semibold text-stone-800">{p.slice(2, -2)}</strong>;
                if (/^`[^`]+`$/.test(p)) return <code key={i} className="px-1.5 py-0.5 rounded-md bg-cream-200 text-ember-700 font-mono text-[11px]">{p.slice(1, -1)}</code>;
                if (/^\*[^*]+\*$/.test(p)) return <em key={i} className="italic text-stone-500">{p.slice(1, -1)}</em>;
                return <span key={i}>{p}</span>;
            });
        }
        function renderRich(text) {
            const blocks = String(text || '').split(/\n{2,}/);
            return blocks.map((b, i) => {
                const t = b.trim();
                if (!t) return null;
                if (t.startsWith('```')) {
                    const lines = b.split('\n');
                    const code = lines.slice(1, lines.length - (lines[lines.length - 1].trim() === '```' ? 1 : 0)).join('\n');
                    return <pre key={i} className="my-2 rounded-xl bg-cream-100 border border-cream-300 px-4 py-3 font-mono text-[11px] leading-relaxed text-stone-700 overflow-x-auto custom-scrollbar whitespace-pre-wrap">{code}</pre>;
                }
                const heading = t.match(/^(#{1,4})\s+(.*)/);
                if (heading) {
                    const size = heading[1].length >= 3 ? 'text-[12px]' : 'text-[13px]';
                    return <div key={i} className={size + ' font-semibold text-stone-800 mt-2.5 mb-1'}><Inline text={heading[2]} /></div>;
                }
                const lines = b.split('\n');
                if (lines.every(l => /^[-*•]\s+/.test(l.trim()))) {
                    return (
                        <div key={i} className="my-1.5 space-y-1">
                            {lines.map((l, j) => (
                                <div key={j} className="flex gap-2 text-[13px] leading-relaxed text-stone-600">
                                    <span className="text-ember-500 shrink-0 mt-px">•</span>
                                    <span><Inline text={l.replace(/^[-*•]\s+/, '')} /></span>
                                </div>
                            ))}
                        </div>
                    );
                }
                if (lines.every(l => /^\d+\.\s+/.test(l.trim()))) {
                    return (
                        <div key={i} className="my-1.5 space-y-1">
                            {lines.map((l, j) => (
                                <div key={j} className="flex gap-2 text-[13px] leading-relaxed text-stone-600">
                                    <span className="text-stone-400 font-mono text-[11px] shrink-0 pt-px">{l.match(/^\d+/)[0]}.</span>
                                    <span><Inline text={l.replace(/^\d+\.\s+/, '')} /></span>
                                </div>
                            ))}
                        </div>
                    );
                }
                return (
                    <p key={i} className="text-[13px] leading-relaxed text-stone-600 my-1">
                        {lines.map((l, j) => <span key={j}>{j > 0 && <br />}<Inline text={l} /></span>)}
                    </p>
                );
            });
        }

        function relTime(ts) {

                const parts = String(ts || '').split(':');
                if (parts.length === 3) { const d = new Date(); d.setHours(+parts[0], +parts[1], +parts[2]); ts = d.getTime(); }
                const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
                if (diff < 60) return 'now';
                if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                return Math.floor(diff / 86400) + 'd ago';
            } catch (e) { return ts; }
        }

        function ParticleCanvas() {
            const ref = useRef(null);
            useEffect(() => {
                const canvas = ref.current;
                const ctx = canvas.getContext('2d');
                let raf, particles = [], w, h, dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                const resize = () => { w = canvas.clientWidth; h = canvas.clientHeight; canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
                const seed = () => { const n = (w < 768 || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) ? 0 : 48; particles = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25, r: 1 + Math.random() * 2.2, warm: Math.random() < 0.6 })); };
                const step = () => {
                    ctx.clearRect(0, 0, w, h);
                    for (const p of particles) {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10;
                        if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = p.warm ? 'rgba(249,115,22,0.28)' : 'rgba(120,105,85,0.20)'; ctx.fill();
                    }
                    for (let i = 0; i < particles.length; i++) for (let j = i + 1; j < particles.length; j++) {
                        const a = particles[i], b = particles[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
                        if (d2 < 105 * 105) {
                            const alpha = (1 - Math.sqrt(d2) / 105) * 0.12;
                            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = 'rgba(234,88,12,' + alpha + ')'; ctx.lineWidth = 1; ctx.stroke();
                        }
                    }
                    raf = requestAnimationFrame(step);
                };
                resize(); seed();
                let reduced = false;
                try { reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
                if (!reduced) step();
                const onVis = () => { if (document.hidden) cancelAnimationFrame(raf); else { raf = requestAnimationFrame(step); } };
                document.addEventListener('visibilitychange', onVis);
                const onResize = () => { resize(); seed(); };
                window.addEventListener('resize', onResize);
                return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); document.removeEventListener('visibilitychange', onVis); };
            }, []);
            return <canvas id="particle-canvas" ref={ref}></canvas>;
        }
