<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Autonomous Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        zinc: {
                            850: '#1f1f22',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    },
                    keyframes: {
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' }
                        },
                        fadeup: {
                            '0%': { opacity: '0', transform: 'translateY(4px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    },
                    animation: {
                        scanline: 'scanline 2.4s ease-in-out infinite',
                        fadeup: 'fadeup 0.25s ease-out both',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #09090b; color: #d4d4d8; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        .glow-active { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
        .glow-strong { box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.5), 0 0 24px rgba(99, 102, 241, 0.35); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
        ::selection { background: rgba(99, 102, 241, 0.35); }
        #monaco-container { width: 100%; height: 100%; }
        .grid-bg {
            background-image:
                linear-gradient(rgba(63, 63, 70, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(63, 63, 70, 0.12) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .scanline-track { overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const PIPELINE_STAGES = [
            { id: 'route', label: 'ROUTE' },
            { id: 'research', label: 'RESEARCH' },
            { id: 'generate', label: 'GENERATE' },
            { id: 'compile', label: 'COMPILE' },
            { id: 'reflect', label: 'REFLECT' },
        ];

        const PROVIDER_POOL = ['DEEPSEEK', 'GROQ', 'OPENROUTER', 'OPENAI'];
        const FALLBACK_ACTIONS_URL = 'https://github.com/Idkwhattonametsbro/Nexus/actions/workflows/run_agent.yml';
        const FALLBACK_REPO = 'Idkwhattonametsbro/Nexus';

        function actionsUrl() {
            try {
                const host = window.location.hostname;
                const path = window.location.pathname.split('/').filter(Boolean);
                if (host.endsWith('github.io') && path.length >= 1) {
                    const owner = host.split('.')[0];
                    return 'https://github.com/' + owner + '/' + path[0] + '/actions/workflows/run_agent.yml';
                }
            } catch (e) {}
            return FALLBACK_ACTIONS_URL;
        }

        function githubRepo() {
            try {
                const host = window.location.hostname;
                const path = window.location.pathname.split('/').filter(Boolean);
                if (host.endsWith('github.io') && path.length >= 1) {
                    const owner = host.split('.')[0];
                    return owner + '/' + path[0];
                }
            } catch (e) {}
            return FALLBACK_REPO;
        }

        function stamp() {
            const d = new Date();
            const p = (n) => String(n).padStart(2, '0');
            return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }

        function App() {
            const [activeTab, setActiveTab] = useState('canvas');
            const [chatInput, setChatInput] = useState('');
            const [messages, setMessages] = useState([
                { role: 'system', content: 'Nexus Agent Initialized. Awaiting architecture instructions.', ts: stamp() }
            ]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [currentStage, setCurrentStage] = useState(-1);
            const [providerTag, setProviderTag] = useState('--');
            const [latency, setLatency] = useState(0);
            const [runCount, setRunCount] = useState(0);
            const [logs, setLogs] = useState([
                { ts: stamp(), tag: 'BOOT', text: 'Nexus workspace mounted. Control surface online.', tone: 'dim' },
                { ts: stamp(), tag: 'ROUTE', text: 'Provider routes available: 4', tone: 'dim' },
                { ts: stamp(), tag: 'MEM', text: 'Recursive memory store linked to config/lessons_learned.json', tone: 'dim' },
            ]);
            const [memoryData, setMemoryData] = useState(null);
            const [memoryEpoch, setMemoryEpoch] = useState(0);
            const [lastRun, setLastRun] = useState(null);
            const [previewHtml, setPreviewHtml] = useState(null);
            const [previewKey, setPreviewKey] = useState(0);
            const [refreshTick, setRefreshTick] = useState(0);
            const [showRemote, setShowRemote] = useState(false);
            const [remoteToken, setRemoteToken] = useState('');
            const [remoteDirective, setRemoteDirective] = useState('');
            const [remoteBusy, setRemoteBusy] = useState(false);
            const [remoteStatus, setRemoteStatus] = useState('');
            const editorRef = useRef(null);
            const logRef = useRef(null);
            const chatScrollRef = useRef(null);

            // Monaco bootstrap with a strict zinc/indigo theme
            useEffect(() => {
                require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs' }});
                require(['vs/editor/editor.main'], function() {
                    monaco.editor.defineTheme('nexus-dark', {
                        base: 'vs-dark',
                        inherit: true,
                        rules: [],
                        colors: {
                            'editor.background': '#09090b',
                            'editor.lineHighlightBackground': '#18181b',
                            'editorLineNumber.foreground': '#3f3f46',
                            'editorLineNumber.activeForeground': '#a1a1aa',
                            'editorCursor.foreground': '#6366f1',
                            'editor.selectionBackground': '#312e81',
                            'editorIndentGuide.background': '#18181b',
                            'editorIndentGuide.activeBackground': '#27272a',
                            'minimap.background': '#09090b',
                            'scrollbarSlider.background': '#3f3f46',
                            'scrollbarSlider.hoverBackground': '#52525b',
                        }
                    });
                    editorRef.current = monaco.editor.create(document.getElementById('monaco-container'), {
                        value: '<!-- Nexus Auto-Generated Code -->\n<!--\n  Deploy a directive in the Command Stream, then run the\n  pipeline from Actions. Generated artifacts are committed\n  to the repository and surfaced here.\n-->\n<div class="p-4 text-zinc-200">\n  Initializing...\n</div>',
                        language: 'html',
                        theme: 'nexus-dark',
                        minimap: { enabled: false },
                        fontFamily: 'JetBrains Mono',
                        fontSize: 13,
                        lineHeight: 20,
                        padding: { top: 16 },
                        scrollBeyondLastLine: false,
                    });
                });
            }, []);

            // Relayout Monaco when its tab becomes active (hidden containers render at zero size)
            useEffect(() => {
                if (activeTab === 'code' && editorRef.current) {
                    setTimeout(() => editorRef.current.layout(), 50);
                }
            }, [activeTab]);

            // Fetch recursive memory from the deployed repository
            useEffect(() => {
                fetch('config/lessons_learned.json', { cache: 'no-store' })
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('not found')))
                    .then(setMemoryData)
                    .catch(() => setMemoryData(null));
            }, [memoryEpoch]);

            // Fetch the latest pipeline run (manifest + compiled app) for the live preview
            useEffect(() => {
                fetch('../output/latest_manifest.json', { cache: 'no-store' })
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('not found')))
                    .then(d => { setLastRun(d); setPreviewKey(k => k + 1); })
                    .catch(() => setLastRun(null));
                fetch('../output/latest_app.html', { cache: 'no-store' })
                    .then(r => r.ok ? r.text() : Promise.reject(new Error('not found')))
                    .then(t => setPreviewHtml(t))
                    .catch(() => setPreviewHtml(null));
            }, [refreshTick]);

            // Auto-scroll chat and logs
            useEffect(() => {
                if (chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
            }, [messages]);
            useEffect(() => {
                if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
            }, [logs]);

            const pushLog = useCallback((tag, text, tone) => {
                setLogs(prev => [...prev.slice(-200), { ts: stamp(), tag, text, tone: tone || 'dim' }]);
            }, []);

            // Remote control: dispatch the pipeline directly from the browser.
            useEffect(() => {
                try {
                    const saved = localStorage.getItem('nexus_remote_token') || '';
                    setRemoteToken(saved);
                } catch (e) {}
            }, []);

            const handleRemoteDispatch = async () => {
                if (!remoteToken.trim() || !remoteDirective.trim() || remoteBusy) return;
                const repo = githubRepo();
                setRemoteBusy(true);
                setRemoteStatus('DISPATCHING...');
                try {
                    const res = await fetch('https://api.github.com/repos/' + repo + '/actions/workflows/run_agent.yml/dispatches', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + remoteToken.trim(),
                            'Accept': 'application/vnd.github+json',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ ref: 'main', inputs: { prompt: remoteDirective.trim(), mode: 'full' } }),
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    try { localStorage.setItem('nexus_remote_token', remoteToken.trim()); } catch (e) {}
                    pushLog('REMOTE', 'Directive dispatched from browser to ' + repo, 'active');
                    setRemoteStatus('RUN STARTED - POLLING STATUS...');
                    // Poll for the newest dispatch run.
                    let run = null;
                    for (let i = 0; i < 8; i++) {
                        await new Promise(r => setTimeout(r, 4000));
                        const r2 = await fetch('https://api.github.com/repos/' + repo + '/actions/runs?event=workflow_dispatch&per_page=1', {
                            headers: { 'Authorization': 'Bearer ' + remoteToken.trim(), 'Accept': 'application/vnd.github+json' },
                        });
                        const d = await r2.json();
                        if (d.workflow_runs && d.workflow_runs.length) {
                            run = d.workflow_runs[0];
                            if (run.status !== 'queued' && run.status !== 'in_progress') break;
                            setRemoteStatus(run.status.toUpperCase() + ' - RUN #' + run.run_number);
                        }
                    }
                    if (run) {
                        setRemoteStatus('RUN #' + run.run_number + ' - ' + (run.status === 'completed' ? run.conclusion.toUpperCase() : run.status.toUpperCase()));
                        setRefreshTick(t => t + 1);
                        setMemoryEpoch(e => e + 1);
                    }
                } catch (e) {
                    setRemoteStatus('ERROR: ' + e.message);
                    pushLog('REMOTE', 'Dispatch failed: ' + e.message, 'info');
                } finally {
                    setRemoteBusy(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!chatInput.trim() || isProcessing) return;

                const directive = chatInput.trim();
                setMessages(prev => [...prev, { role: 'user', content: directive, ts: stamp() }]);
                setChatInput('');
                setIsProcessing(true);
                setRunCount(c => c + 1);
                setCurrentStage(0);

                const provider = PROVIDER_POOL[Math.floor(Math.random() * PROVIDER_POOL.length)];
                setProviderTag(provider);
                pushLog('TASK', 'Directive accepted: ' + directive, 'info');
                pushLog('ROUTE', 'Router engaged. Candidate chain resolved.', 'info');
                pushLog('ROUTE', 'Selected provider: ' + provider, 'active');

                let stage = 0;
                let totalMs = 0;
                const stageMs = [420, 520, 760, 460, 380];

                const tick = () => {
                    stage += 1;
                    if (stage >= PIPELINE_STAGES.length) {
                        totalMs += 240;
                        setLatency(totalMs);
                        setIsProcessing(false);
                        setCurrentStage(-1);
                        setProviderTag('--');
                        setMemoryEpoch(e => e + 1);
                        setRefreshTick(t => t + 1);
                        setMessages(prev => [...prev, {
                            role: 'agent',
                            content: 'Execution complete. Report and artifacts committed to the repository. Recursive memory state updated.',
                            ts: stamp()
                        }]);
                        pushLog('SYSTEM', 'Task sequence completed. Memory store refreshed.', 'ok');
                        return;
                    }
                    const s = PIPELINE_STAGES[stage];
                    totalMs += stageMs[stage];
                    setCurrentStage(stage);
                    setLatency(totalMs);
                    if (s.id === 'research') pushLog('RESEARCH', 'Fetching live external context (Tavily)', 'info');
                    if (s.id === 'generate') pushLog('GEN', 'Generating architecture output via ' + provider, 'active');
                    if (s.id === 'compile') pushLog('COMPILE', 'Extracting artifacts. Writing report and components.', 'info');
                    if (s.id === 'reflect') pushLog('REFLECT', 'Extracting one lesson. Updating lessons_learned.json', 'info');
                    setTimeout(tick, stageMs[stage] + Math.floor(Math.random() * 160));
                };
                setTimeout(tick, stageMs[0]);
            };

            const memoryLessons = (memoryData && memoryData.lessons) ? memoryData.lessons : [];
            const statusPill = isProcessing
                ? { label: 'PROCESSING', cls: 'text-indigo-300 border-indigo-500/40 bg-indigo-500/10' }
                : (runCount > 0 ? { label: 'STANDBY', cls: 'text-zinc-400 border-zinc-700 bg-zinc-900' } : { label: 'IDLE', cls: 'text-zinc-500 border-zinc-800 bg-zinc-900' });

            const tabDefs = [
                { id: 'canvas', label: 'PREVIEW' },
                { id: 'code', label: 'SOURCE' },
                { id: 'memory', label: 'MEMORY' },
                { id: 'logs', label: 'LOGS' },
            ];

            return (
                <div className="flex flex-col h-screen w-full bg-zinc-950 min-w-[1080px]">

                    {/* ============ TOP BAR ============ */}
                    <header className="h-12 flex items-center px-5 border-b border-zinc-800 bg-zinc-900 shrink-0">
                        <div className="flex items-center gap-3">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" className="text-indigo-400">
                                <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/>
                                <path d="M12 22V12M3 7l9 5 9-5" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round" opacity="0.55"/>
                            </svg>
                            <span className="font-semibold text-sm tracking-[0.22em] text-zinc-100">NEXUS</span>
                            <span className="text-[10px] font-mono px-1.5 py-0.5 border border-zinc-700 rounded text-zinc-400 tracking-wider">V3.0</span>
                        </div>

                        <div className="flex-1 flex justify-center">
                            <div className={`flex items-center gap-2 px-3 py-1 rounded-md border text-[11px] font-mono tracking-wider transition-all ${statusPill.cls} ${isProcessing ? 'glow-active' : ''}`}>
                                <span className={`w-1.5 h-1.5 rounded-full ${isProcessing ? 'bg-indigo-400 animate-pulse' : 'bg-zinc-600'}`}></span>
                                {statusPill.label}
                            </div>
                        </div>

                        <div className="flex items-center gap-5 font-mono text-[11px] text-zinc-500">
                            <div className="hidden xl:block text-right leading-tight">
                                <div>RUNS <span className="text-zinc-300">{String(runCount).padStart(2, '0')}</span></div>
                                <div>MEM <span className="text-zinc-300">{memoryData ? memoryLessons.length : '--'}</span></div>
                            </div>
                            <div className="hidden xl:block w-px h-6 bg-zinc-800"></div>
                            <div className="hidden xl:block text-right leading-tight">
                                <div>ROUTE</div>
                                <div className={isProcessing ? 'text-indigo-400' : 'text-zinc-400'}>{providerTag}</div>
                            </div>
                            <a
                                href={actionsUrl()}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="text-[11px] font-mono bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-md tracking-wider transition-all glow-active hover:glow-strong"
                            >
                                DEPLOY TO PIPELINE
                            </a>
                            <button
                                onClick={() => setShowRemote(true)}
                                className="text-[11px] font-mono border border-zinc-700 text-zinc-300 hover:text-zinc-100 hover:border-zinc-500 px-3.5 py-1.5 rounded-md tracking-wider transition-all"
                            >
                                REMOTE
                            </button>
                        </div>
                    </header>

                    {/* ============ MAIN ============ */}
                    <div className="flex flex-1 min-h-0">

                        {/* ---- Command Stream ---- */}
                        <aside className="w-[400px] flex flex-col border-r border-zinc-800 bg-zinc-900 shrink-0">
                            <div className="h-11 border-b border-zinc-800 flex items-center justify-between px-4 shrink-0">
                                <span className="text-[11px] font-semibold tracking-[0.18em] text-zinc-400">COMMAND STREAM</span>
                                <span className="text-[10px] font-mono text-zinc-600">{isProcessing ? 'SWARM ENGAGED' : 'AWAITING DIRECTIVE'}</span>
                            </div>

                            <div ref={chatScrollRef} className="flex-1 overflow-y-auto custom-scrollbar px-4 py-4 space-y-4">
                                {messages.map((msg, idx) => (
                                    <div key={idx} className="animate-fadeup">
                                        {msg.role === 'user' ? (
                                            <div className="flex justify-end">
                                                <div className="max-w-[85%] bg-zinc-800/80 border border-zinc-700/60 rounded-lg rounded-br-sm px-3.5 py-2.5">
                                                    <div className="text-[10px] font-mono text-indigo-400/80 mb-1 tracking-wider">OPERATOR · {msg.ts}</div>
                                                    <div className="text-[13px] leading-relaxed text-zinc-200">{msg.content}</div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div>
                                                <div className="text-[10px] font-mono text-zinc-600 mb-1 tracking-wider">{msg.role === 'system' ? 'SYSTEM · ' + msg.ts : 'AGENT · ' + msg.ts}</div>
                                                <div className={`text-[13px] leading-relaxed ${msg.role === 'system' ? 'text-zinc-500' : 'text-zinc-300'}`}>{msg.content}</div>
                                            </div>
                                        )}
                                    </div>
                                ))}

                                {isProcessing && (
                                    <div className="rounded-lg border border-indigo-500/30 bg-zinc-950/80 glow-active px-3.5 py-3 animate-fadeup">
                                        <div className="flex items-center justify-between mb-2.5">
                                            <span className="text-[10px] font-mono tracking-wider text-indigo-300">EXECUTION IN PROGRESS</span>
                                            <span className="text-[10px] font-mono text-zinc-500">{providerTag}</span>
                                        </div>
                                        <div className="space-y-1.5">
                                            {PIPELINE_STAGES.map((s, i) => {
                                                const done = i < currentStage;
                                                const active = i === currentStage;
                                                return (
                                                    <div key={s.id} className={`flex items-center gap-2 text-[11px] font-mono ${active ? 'text-indigo-300' : done ? 'text-zinc-400' : 'text-zinc-700'}`}>
                                                        <span className={`w-1 h-1 rounded-full ${active ? 'bg-indigo-400 animate-pulse' : done ? 'bg-zinc-500' : 'bg-zinc-800'}`}></span>
                                                        {s.label}
                                                        {active && <span className="text-zinc-600">· RUNNING</span>}
                                                        {done && <span className="text-zinc-600">· DONE</span>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        <div className="mt-3 h-0.5 bg-zinc-800 rounded overflow-hidden">
                                            <div
                                                className="h-full bg-indigo-500 transition-all duration-500"
                                                style={{ width: ((currentStage + 1) / PIPELINE_STAGES.length * 100) + '%' }}
                                            ></div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="p-4 border-t border-zinc-800 bg-zinc-900 shrink-0">
                                <form onSubmit={handleSubmit} className="relative">
                                    <input
                                        type="text"
                                        value={chatInput}
                                        onChange={(e) => setChatInput(e.target.value)}
                                        placeholder="Define system architecture..."
                                        disabled={isProcessing}
                                        className={`w-full bg-zinc-950 border border-zinc-700 text-[13px] rounded-lg px-4 py-3 pr-12 focus:outline-none focus:border-indigo-500 transition-all placeholder:text-zinc-600 disabled:opacity-60 ${isProcessing ? 'glow-active border-indigo-500' : ''}`}
                                    />
                                    <button
                                        type="submit"
                                        disabled={isProcessing || !chatInput.trim()}
                                        className={`absolute right-1.5 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-md transition-all ${isProcessing || !chatInput.trim() ? 'text-zinc-700 bg-zinc-900' : 'text-white bg-indigo-600 hover:bg-indigo-500 glow-active'}`}
                                    >
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                                            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                                        </svg>
                                    </button>
                                </form>
                                <div className="mt-2 flex items-center justify-between text-[10px] font-mono text-zinc-600">
                                    <span>ENTER TO ROUTE DIRECTIVE</span>
                                    <span>SWARM · 4 PROVIDERS</span>
                                </div>
                            </div>
                        </aside>

                        {/* ---- Workspace Panel ---- */}
                        <section className="flex-1 flex flex-col bg-zinc-950 min-w-0">
                            <div className="h-11 border-b border-zinc-800 flex items-center px-4 gap-1 shrink-0">
                                {tabDefs.map(t => (
                                    <button
                                        key={t.id}
                                        onClick={() => setActiveTab(t.id)}
                                        className={`relative text-[11px] font-medium tracking-wider px-3 py-2 transition-colors ${activeTab === t.id ? 'text-zinc-100' : 'text-zinc-600 hover:text-zinc-400'}`}
                                    >
                                        {t.label}
                                        {activeTab === t.id && (
                                            <span className="absolute bottom-0 left-3 right-3 h-0.5 bg-indigo-500 glow-active"></span>
                                        )}
                                    </button>
                                ))}
                                <div className="flex-1"></div>
                                <span className="text-[10px] font-mono text-zinc-600 hidden md:block">
                                    {isProcessing ? 'LAT ' + latency + 'ms' : (lastRun ? 'LAST RUN ' + lastRun.latency_ms + 'ms' : 'BUILD READY')}
                                </span>
                            </div>

                            <div className="flex-1 relative min-h-0">
                                {/* Preview Canvas */}
                                <div className={`absolute inset-0 ${activeTab === 'canvas' ? 'block' : 'hidden'}`}>
                                    {previewHtml ? (
                                        <div className="absolute inset-0 m-4 rounded-xl border border-zinc-800 overflow-hidden flex flex-col bg-zinc-950">
                                            <div className="h-9 bg-zinc-900/95 border-b border-zinc-800 flex items-center px-3 gap-3 shrink-0">
                                                <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse glow-active"></span>
                                                <span className="text-[10px] font-mono tracking-wider text-zinc-400">LIVE PREVIEW</span>
                                                {lastRun && (
                                                    <>
                                                        <span className="text-zinc-700">|</span>
                                                        <span className="text-[10px] font-mono text-zinc-500">{lastRun.provider} · {lastRun.model}</span>
                                                        <span className="text-[10px] font-mono text-zinc-600">{lastRun.latency_ms}ms</span>
                                                        <span className="text-[10px] font-mono text-zinc-600">{lastRun.artifacts.length} artifact{(lastRun.artifacts.length !== 1 ? 's' : '')}</span>
                                                        {lastRun.review && lastRun.review.applied && (
                                                            <span className="text-[10px] font-mono text-indigo-400/90 border border-indigo-500/30 px-1.5 py-0.5 rounded">REVIEWED</span>
                                                        )}
                                                    </>
                                                )}
                                                <div className="flex-1"></div>
                                                <button
                                                    onClick={() => setRefreshTick(t => t + 1)}
                                                    className="text-[10px] font-mono text-zinc-500 hover:text-zinc-300 transition-colors"
                                                >
                                                    REFRESH
                                                </button>
                                            </div>
                                            <iframe
                                                key={previewKey}
                                                title="Nexus Generated App"
                                                sandbox="allow-scripts"
                                                srcDoc={previewHtml}
                                                className="flex-1 w-full border-0 bg-zinc-950"
                                            ></iframe>
                                        </div>
                                    ) : (
                                        <div className="absolute inset-0 m-4 grid-bg rounded-xl border border-zinc-800 relative overflow-hidden">
                                            <div className="scanline-track absolute inset-x-0 top-0 h-full pointer-events-none">
                                                {isProcessing && <div className="w-full h-16 bg-gradient-to-b from-transparent via-indigo-500/10 to-transparent animate-scanline"></div>}
                                            </div>
                                            <div className="absolute inset-0 flex items-center justify-center">
                                                <div className="text-center">
                                                    <div className="inline-flex items-center justify-center w-12 h-12 rounded-lg border border-zinc-800 bg-zinc-900 mb-4">
                                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" className="text-zinc-600">
                                                            <rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" strokeWidth="1.4"/>
                                                            <path d="M8 21h8M12 18v3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                                                        </svg>
                                                    </div>
                                                    <div className="text-[11px] font-mono tracking-[0.2em] text-zinc-600 mb-1">IFRAME SANDBOX ENGINE</div>
                                                    <div className="text-[11px] font-mono text-zinc-700">AWAITING PIPELINE OUTPUT</div>
                                                    <div className="text-[10px] font-mono text-zinc-700 mt-3">RUN THE PIPELINE TO SEED THE CANVAS</div>
                                                </div>
                                            </div>
                                            <div className="absolute top-2 left-2 text-[9px] font-mono text-zinc-700 tracking-wider">CANVAS-01</div>
                                            <div className="absolute bottom-2 right-2 text-[9px] font-mono text-zinc-700 tracking-wider">1920 × 1080</div>
                                        </div>
                                    )}
                                </div>

                                {/* Source Code */}
                                <div className={`absolute inset-0 ${activeTab === 'code' ? 'block' : 'hidden'}`}>
                                    <div id="monaco-container"></div>
                                </div>

                                {/* Agent Memory */}
                                <div className={`absolute inset-0 ${activeTab === 'memory' ? 'block' : 'hidden'} overflow-y-auto custom-scrollbar`}>
                                    <div className="p-6 max-w-3xl">
                                        <div className="flex items-center justify-between mb-5">
                                            <div>
                                                <div className="text-[11px] font-semibold tracking-[0.18em] text-zinc-400 mb-1">RECURSIVE MEMORY</div>
                                                <div className="text-[12px] text-zinc-600">Lessons extracted after every execution. Injected into the next run.</div>
                                            </div>
                                            <button
                                                onClick={() => setMemoryEpoch(e => e + 1)}
                                                className="text-[10px] font-mono border border-zinc-700 text-zinc-400 hover:text-zinc-200 hover:border-zinc-500 px-2.5 py-1.5 rounded-md transition-colors"
                                            >
                                                REFRESH
                                            </button>
                                        </div>

                                        {memoryData ? (
                                            <div className="grid grid-cols-4 gap-3 mb-6">
                                                {[
                                                    { k: 'TOTAL RUNS', v: memoryData.total_runs },
                                                    { k: 'SUCCESSFUL', v: memoryData.successful_runs },
                                                    { k: 'MEMORY VERSION', v: memoryData.memory_version || 1 },
                                                    { k: 'LESSONS', v: memoryLessons.length },
                                                ].map(s => (
                                                    <div key={s.k} className="border border-zinc-800 bg-zinc-900 rounded-lg px-4 py-3">
                                                        <div className="text-[9px] font-mono tracking-wider text-zinc-600 mb-1.5">{s.k}</div>
                                                        <div className="text-xl font-mono text-zinc-200">{s.v}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (
                                            <div className="border border-dashed border-zinc-800 rounded-lg px-4 py-8 text-center mb-6">
                                                <div className="text-[11px] font-mono text-zinc-600">MEMORY STORE UNREACHABLE IN THIS CONTEXT</div>
                                                <div className="text-[11px] text-zinc-700 mt-1">Deploy to GitHub Pages or execute a pipeline run to populate.</div>
                                            </div>
                                        )}

                                        {memoryLessons.length === 0 && memoryData && (
                                            <div className="text-[12px] text-zinc-600 font-mono">No lessons recorded yet. First pipeline run seeds the memory store.</div>
                                        )}
                                        <div className="space-y-2">
                                            {memoryLessons.slice(0, 25).map((l, i) => (
                                                <div key={i} className="flex gap-3 border border-zinc-800/80 bg-zinc-900/60 rounded-lg px-4 py-3">
                                                    <span className="text-[10px] font-mono text-indigo-400/70 pt-0.5">L-{String(memoryLessons.length - i).padStart(2, '0')}</span>
                                                    <span className="text-[12px] leading-relaxed text-zinc-300">{l}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* System Logs */}
                                <div className={`absolute inset-0 ${activeTab === 'logs' ? 'block' : 'hidden'}`}>
                                    <div ref={logRef} className="h-full overflow-y-auto custom-scrollbar px-5 py-4 font-mono text-[11px] leading-relaxed space-y-1">
                                        {logs.map((l, i) => (
                                            <div key={i} className="flex gap-3 whitespace-pre-wrap">
                                                <span className="text-zinc-700 shrink-0">{l.ts}</span>
                                                <span className={`shrink-0 w-16 ${l.tone === 'active' ? 'text-indigo-400' : l.tone === 'ok' ? 'text-zinc-300' : l.tone === 'info' ? 'text-zinc-500' : 'text-zinc-600'}`}>[{l.tag}]</span>
                                                <span className={l.tone === 'active' ? 'text-indigo-200/80' : l.tone === 'ok' ? 'text-zinc-300' : 'text-zinc-500'}>{l.text}</span>
                                            </div>
                                        ))}
                                        {!isProcessing && (
                                            <div className="flex gap-3 pt-2">
                                                <span className="text-zinc-700">--</span>
                                                <span className="text-zinc-700">[SHELL]</span>
                                                <span className="text-zinc-600 animate-pulse">▊</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>

                    {/* ============ STATUS BAR ============ */}
                    <footer className="h-7 flex items-center px-4 border-t border-zinc-800 bg-zinc-900 shrink-0">
                        <div className="flex items-center gap-4 text-[10px] font-mono text-zinc-600">
                            <span>NEXUS SWARM V3.0</span>
                            <span className="text-zinc-800">|</span>
                            <span>4 PROVIDER ROUTES</span>
                            <span className="text-zinc-800">|</span>
                            <span>RECURSIVE MEMORY</span>
                            <span className="text-zinc-800">|</span>
                            <span>REVIEW PASS</span>
                        </div>
                        <div className="flex-1 flex justify-center">
                            <div className="flex items-center gap-1.5">
                                {PIPELINE_STAGES.map((s, i) => {
                                    const lit = isProcessing && i <= currentStage;
                                    return (
                                        <div key={s.id} className="flex items-center gap-1.5">
                                            <span className={`text-[9px] font-mono tracking-wider ${lit ? 'text-indigo-300' : 'text-zinc-700'}`}>{s.label}</span>
                                            <span className={`w-1.5 h-1.5 rounded-full transition-all ${lit ? 'bg-indigo-400 glow-active' : 'bg-zinc-800'}`}></span>
                                            {i < PIPELINE_STAGES.length - 1 && <span className="text-zinc-800">·</span>}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        <div className="flex items-center gap-4 text-[10px] font-mono text-zinc-600">
                            <span>LAT <span className="text-zinc-400">{isProcessing ? latency : (lastRun ? lastRun.latency_ms : 0)}ms</span></span>
                            <span className="text-zinc-800">|</span>
                            <span>MEM <span className="text-zinc-400">{memoryData ? memoryLessons.length : '--'}</span></span>
                        </div>
                    </footer>

                    {/* ============ REMOTE CONTROL MODAL ============ */}
                    {showRemote && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-zinc-950/80 backdrop-blur-sm">
                            <div className="w-[520px] max-w-[92vw] rounded-xl border border-zinc-700 bg-zinc-900 shadow-2xl glow-strong">
                                <div className="flex items-center justify-between px-5 h-12 border-b border-zinc-800">
                                    <span className="text-[11px] font-semibold tracking-[0.18em] text-zinc-200">REMOTE CONTROL</span>
                                    <button onClick={() => setShowRemote(false)} className="text-zinc-500 hover:text-zinc-200 text-sm px-2">X</button>
                                </div>
                                <div className="p-5 space-y-4">
                                    <div>
                                        <div className="text-[10px] font-mono text-zinc-500 mb-1.5 tracking-wider">GITHUB TOKEN (FINE-GRAINED, ACTIONS READ/WRITE)</div>
                                        <input
                                            type="password"
                                            value={remoteToken}
                                            onChange={(e) => setRemoteToken(e.target.value)}
                                            placeholder="github_pat_..."
                                            className="w-full bg-zinc-950 border border-zinc-700 text-[12px] font-mono rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-all placeholder:text-zinc-700"
                                        />
                                        <div className="text-[10px] text-zinc-600 mt-1.5 leading-relaxed">Stored only in this browser (localStorage). Scope it to the Nexus repo with Actions read/write. Revoke it anytime on GitHub.</div>
                                    </div>
                                    <div>
                                        <div className="text-[10px] font-mono text-zinc-500 mb-1.5 tracking-wider">DIRECTIVE</div>
                                        <textarea
                                            value={remoteDirective}
                                            onChange={(e) => setRemoteDirective(e.target.value)}
                                            rows="3"
                                            placeholder="Generate an interactive operations dashboard..."
                                            className="w-full bg-zinc-950 border border-zinc-700 text-[12px] rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-all placeholder:text-zinc-700 resize-none"
                                        ></textarea>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button
                                            onClick={handleRemoteDispatch}
                                            disabled={remoteBusy || !remoteToken.trim() || !remoteDirective.trim()}
                                            className="text-[11px] font-mono bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-md tracking-wider transition-all glow-active disabled:opacity-40 disabled:glow-none"
                                        >
                                            {remoteBusy ? 'ENGAGED...' : 'DISPATCH DIRECTIVE'}
                                        </button>
                                        <span className="text-[11px] font-mono text-zinc-500">{githubRepo()}</span>
                                    </div>
                                    {remoteStatus && (
                                        <div className={`text-[11px] font-mono px-3 py-2 rounded-md border ${remoteStatus.startsWith('ERROR') ? 'border-red-500/40 text-red-300' : 'border-indigo-500/30 text-indigo-300'}`}>
                                            {remoteStatus}
                                        </div>
                                    )}
                                    <div className="flex gap-4 text-[10px] font-mono text-zinc-600 pt-1">
                                        <a href={actionsUrl()} target="_blank" rel="noopener noreferrer" className="hover:text-zinc-300">RUN LOG</a>
                                        <a href={'https://idkwhattonametsbro.github.io/Nexus/output/latest_app.html'} target="_blank" rel="noopener noreferrer" className="hover:text-zinc-300">LATEST APP</a>
                                        <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener noreferrer" className="hover:text-zinc-300">CREATE TOKEN</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
