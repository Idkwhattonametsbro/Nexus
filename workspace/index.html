                            <pre className="px-3.5 py-2.5 font-mono text-[10.5px] leading-relaxed text-stone-600 max-h-64 overflow-y-auto custom-scrollbar whitespace-pre-wrap">{m.content || '<!-- no content -->'}</pre>
                        </div>
                    );
                }
                if (m.role === 'user') {
                    return (
                        <div className="flex justify-end animate-fadeup">
                            <div className="max-w-[85%] bg-white border border-cream-300 rounded-2xl rounded-br-md px-4 py-3 shadow-soft">
                                <div className="text-[9px] font-mono text-stone-400 mb-1 tracking-wider">YOU · {m.ts}</div>
                                {(m.attachments || []).length > 0 && (
                                    <div className="flex flex-wrap gap-1.5 mb-2">
                                        {(m.attachments || []).map(a => (
                                            a.kind === 'image'
                                                ? <img key={a.id} src={a.dataUrl} alt={a.name} className="h-16 rounded-lg border border-cream-300 object-cover" />
                                                : a.kind === 'video'
                                                ? <span key={a.id} className="inline-flex items-center gap-1 text-[9px] font-mono border border-cream-300 bg-cream-50 rounded-md px-2 py-1 text-stone-500"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M23 7l-7 5 7 5V7z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><rect x="1" y="5" width="15" height="14" rx="2" stroke="currentColor" strokeWidth="1.8"/></svg>{a.name} · video</span>
                                                : <span key={a.id} className="inline-flex items-center gap-1 text-[9px] font-mono border border-cream-300 bg-cream-50 rounded-md px-2 py-1 text-stone-500"><svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>{a.name}</span>
                                        ))}
                                    </div>
                                )}
                                {m.text !== '(attachment only)' && <div className="text-[13px] leading-relaxed text-stone-700">{m.text}</div>}
                            </div>
                        </div>
                    );
                }
                return (
                    <div className="animate-fadeup group/msg">
                        <div className="flex items-center gap-2 text-[9px] font-mono text-stone-400 mb-1 tracking-wider">
                            <span>{m.role === 'system' ? 'SYSTEM · ' + m.ts : 'NEXUS · ' + m.ts + (m.provider ? ' · ' + m.provider : '')} · <span className="text-stone-400">{relTime(m.ts)}</span></span>
                            {m.role !== 'system' && m.text && (
                                <button onClick={() => copyText(m.text)} className="opacity-0 group-hover/msg:opacity-100 transition-opacity text-stone-400 hover:text-ember-600" title="Copy reply">
                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" strokeWidth="1.8"/></svg>
                                </button>
                            )}
                            {m.role !== 'system' && m.text && (
                                <button onClick={() => { try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(m.text.replace(/[#*`>]/g, '')); speechSynthesis.speak(u); } } catch (e) {} }} className="opacity-0 group-hover/msg:opacity-100 transition-opacity text-stone-400 hover:text-ember-600" title="Read aloud">
                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
                                </button>
                            )}
                        </div>
                        <div className={m.role === 'system' ? 'text-[12px] leading-relaxed text-stone-400' : 'space-y-0.5'}>
                            {m.role === 'system' ? <span>{m.text}</span> : renderRich(m.text || '')}
                        </div>
                    </div>
                );
            };

            const statusPill = busy
                ? { label: brainConfigured() ? 'THINKING' : 'PIPELINE', cls: 'text-ember-700 border-ember-300 bg-ember-50' }
                : { label: 'STANDBY', cls: 'text-stone-500 border-cream-400 bg-white' };

            return (
                <div className="h-screen w-full overflow-hidden" style={{ height: '100dvh' }}>
                    <ParticleCanvas />
                    <div className="app-layer flex flex-col h-full">

                        {/* ===== TOP BAR ===== */}
                        <header className="bg-white/95 border-b border-cream-300 shrink-0 z-30 backdrop-blur">
                            <div className="flex items-center gap-3 px-4 h-14">
                                <div className="flex items-center gap-2.5 min-w-0">
                                    <div className="w-8 h-8 rounded-xl brand-gradient shadow-soft flex items-center justify-center shrink-0">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" className="text-white"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" /><path d="M12 22V12M3 7l9 5 9-5" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" opacity="0.6" /></svg>
                                    </div>
                                    <div className="min-w-0">
                                        <div className="flex items-center gap-2">
                                            <span className="font-bold text-[15px] tracking-[0.14em] text-stone-900">NEXUS</span>
                                            <span className="text-[8px] font-mono px-1.5 py-0.5 bg-ember-50 border border-ember-200 rounded-md text-ember-600 tracking-wider">V10.3</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-1"></div>

                                <div className={`hidden sm:flex items-center gap-2 px-3 py-1 rounded-full border text-[9px] font-mono tracking-wider transition-all ${statusPill.cls} ${busy ? 'glow-active' : ''}`}>
                                    <span className={'w-1.5 h-1.5 rounded-full ' + (busy ? 'bg-ember-500 animate-pulse' : 'bg-stone-300')}></span>
                                    {statusPill.label}
                                </div>

                                <button onClick={newChat} className="text-[10px] font-mono btn-primary text-white px-3.5 py-2 rounded-lg tracking-wider transition-all shadow-soft">
                                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" className="inline mr-1"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
                                    NEW CHAT
                                </button>
                                <button onClick={() => { setSchedules(loadSchedules()); setShowScheduler(true); }} className="hidden md:flex w-9 h-9 items-center justify-center rounded-lg border border-cream-400 bg-white text-stone-500 hover:text-ember-600 hover:border-ember-300 transition-all" title="Schedules, timers, reminders">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
                                </button>
                                <button onClick={() => { setShowSettings(true); }} className="hidden md:flex w-9 h-9 items-center justify-center rounded-lg border border-cream-400 bg-white text-stone-500 hover:text-ember-600 hover:border-ember-300 transition-all" title="Brain / models / keys">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" strokeWidth="1.8"/><path d="M12 2v3m0 14v3M4.9 4.9l2.1 2.1m10 10l2.1 2.1M2 12h3m14 0h3M4.9 19.1l2.1-2.1m10-10l2.1-2.1" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
                                </button>

                                {/* overflow menu */}
                                <div className="relative">
                                    <button onClick={() => setShowMenu(!showMenu)} className="w-9 h-9 flex items-center justify-center rounded-lg border border-cream-400 bg-white text-stone-500 hover:text-ember-600 hover:border-ember-300 transition-all" title="More">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
                                    </button>
                                    {showMenu && (
                                        <div className="absolute right-0 top-11 w-48 rounded-xl bg-white border border-cream-300 shadow-lift p-1.5 z-50" onClick={() => setShowMenu(false)}>
                                            {installReady && <button onClick={async () => { try { await deferredInstall.prompt(); const c = await deferredInstall.userChoice; if (c.outcome === 'accepted') setInstallReady(false); } catch (e) {} }} className="w-full text-left text-[11px] font-mono px-3 py-2 rounded-lg hover:bg-cream-100 text-stone-600">⬇ Install app</button>}
                                            <button onClick={exportChat} className="w-full text-left text-[11px] font-mono px-3 py-2 rounded-lg hover:bg-cream-100 text-stone-600">Export chat (.md)</button>
                                            <button onClick={() => setShowRemote(true)} className="w-full text-left text-[11px] font-mono px-3 py-2 rounded-lg hover:bg-cream-100 text-stone-600">GitHub pipeline</button>
                                            <button onClick={clearSession} className="w-full text-left text-[11px] font-mono px-3 py-2 rounded-lg hover:bg-red-50 text-red-500">Clear this chat</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                            {/* mobile: minimal tab row */}
                            <div className="md:hidden flex border-t border-cream-200 bg-white">
                                {[['chat', 'CHAT'], ['chats', 'CHATS'], ['files', 'FILES'], ['runs', 'RUNS']].map(([id, label]) => (
                                    <button key={id} onClick={() => setActiveView(id)} className={'flex-1 py-2.5 text-[9px] font-mono tracking-wider transition-colors ' + (activeView === id ? 'text-ember-600 bg-ember-50 font-semibold' : 'text-stone-400')}>{label}</button>
                                ))}
                            </div>
                        </header>

                        {/* ===== BODY ===== */}
                        <div className="flex flex-1 min-h-0">

                            {/* Sidebar (desktop) */}
                            <aside className="hidden md:flex w-[250px] xl:w-[280px] flex-col border-r border-cream-300 glass shrink-0">
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-4">
                                    <div>
                                        <button onClick={newChat} className="w-full text-[10px] font-mono btn-primary text-white px-3 py-2.5 rounded-xl tracking-wider transition-all shadow-soft mb-2">
                                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" className="inline mr-1"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
                                            NEW CHAT
                                        </button>
                                        <div className="space-y-0.5">
                                            {chats.length === 0 && <div className="text-[10px] font-mono text-stone-400 px-2 py-1">No chats yet.</div>}
                                            {chats.slice().reverse().map(c => (
                                                <div key={c.id} className={'group flex items-center gap-1 rounded-lg px-2 py-1.5 transition-colors ' + (c.id === activeChatId ? 'bg-ember-50 border border-ember-200' : 'hover:bg-cream-100 border border-transparent')}>
                                                    <button onClick={() => switchChat(c.id)} className="flex-1 text-left min-w-0">
                                                        <div className="text-[11px] font-mono text-stone-700 truncate">{c.title}</div>
                                                        <div className="text-[8px] font-mono text-stone-400 truncate">{(c.messages || []).filter(m => m.role === 'user').length} msgs</div>
                                                    </button>
                                                    <button onClick={() => deleteChat(c.id)} title="Delete chat" className="text-stone-300 hover:text-red-400 px-1 transition-colors text-[12px] opacity-0 group-hover:opacity-100">×</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex items-center justify-between px-1 mb-1.5">
                                            <span className="text-[9px] font-mono tracking-[0.18em] text-stone-400">WORKSPACE</span>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => setTreeHidden(!treeHidden)} className="text-[9px] font-mono text-stone-400 hover:text-ember-600">{treeHidden ? 'SHOW HIDDEN' : 'HIDE HIDDEN'}</button>
                                                <button onClick={() => setTreeEpoch(e => e + 1)} className="text-[9px] font-mono text-stone-400 hover:text-ember-600">↻</button>
                                            </div>
                                        </div>
                                        {tree ? (
                                            <div className="bg-white/70 border border-cream-300 rounded-xl p-2 text-[11px] font-mono">
                                                {(tree || []).filter(t => t.type === 'blob').slice(0, 60).map(t => (
                                                    <button key={t.path} onClick={() => openFileContent(t.path)} className="flex items-center gap-2 w-full text-left px-2 py-1 rounded-lg hover:bg-ember-50 hover:text-ember-700 transition-colors text-stone-500">
                                                        <span className="text-[10px]">▸</span>
                                                        <span className="truncate flex-1">{t.path}</span>
                                                    </button>
                                                ))}
                                                <div className="text-[9px] font-mono text-stone-400 px-1 pt-1.5 border-t border-cream-200 mt-1.5">{tree.filter(t => t.type === 'blob').length} FILES</div>
                                            </div>
                                        ) : <div className="bg-white/70 border border-cream-300 rounded-xl p-3 text-[10px] font-mono text-stone-400">Loading tree...</div>}
                                    </div>
                                    <div>
                                        <span className="text-[9px] font-mono tracking-[0.18em] text-stone-400 px-1 mb-1.5 block">SESSION MEMORY</span>
                                        <div className="bg-white/70 border border-cream-300 rounded-xl p-3 space-y-1.5">
                                            {chatMemory.length === 0 ? <div className="text-[10px] font-mono text-stone-400">No lessons this session yet.</div> :
                                                chatMemory.slice(-4).map((l, i) => <div key={i} className="text-[10px] leading-relaxed text-stone-500"><span className="text-ember-500 font-mono">L-{i + 1} </span>{l}</div>)}
                                        </div>
                                    </div>
                                    <div>
                                        <span className="text-[9px] font-mono tracking-[0.18em] text-stone-400 px-1 mb-1.5 block">LAST PIPELINE RUN</span>
                                        {lastRun ? (
                                            <div className="bg-white/70 border border-cream-300 rounded-xl p-3 font-mono text-[10px] space-y-1 text-stone-500">
                                                <div><span className="text-stone-400">PROVIDER</span> <span className="text-stone-700">{lastRun.provider} · {lastRun.model}</span></div>
                                                <div><span className="text-stone-400">LATENCY</span> <span className="text-stone-700">{lastRun.latency_ms}ms</span></div>
                                                {lastRun.review && <div><span className="text-stone-400">REVIEW</span> <span className="text-ember-600">{lastRun.review.applied ? 'APPLIED' : 'APPROVED'}</span></div>}
                                            </div>
                                        ) : <div className="text-[10px] font-mono text-stone-400 px-1">No run yet.</div>}
                                    </div>
                                </div>
                            </aside>

                            {/* Main */}
                            <main className="flex-1 flex flex-col min-w-0">

                                {/* CHAT */}
                                <div className={'flex-1 min-h-0 flex flex-col ' + (activeView === 'chat' ? 'flex' : 'hidden')}>
                                    <div className="shrink-0 px-4 lg:px-8 pt-3 max-w-3xl w-full mx-auto flex items-center gap-2">
                                        <input value={chatSearch} onChange={e => setChatSearch(e.target.value)} placeholder="Search this chat..." className="flex-1 bg-white border border-cream-300 text-[11px] rounded-lg px-3 py-1.5 focus:outline-none focus:border-ember-400 placeholder:text-stone-400 max-w-[220px]" />
                                        <button onClick={() => setFollowMode(!followMode)} className={'text-[9px] font-mono border rounded-lg px-2 py-1.5 transition-all ' + (followMode ? 'border-ember-300 bg-ember-50 text-ember-600' : 'border-cream-400 bg-white text-stone-400')} title="Auto-scroll to newest messages">{followMode ? 'FOLLOW ON' : 'FOLLOW OFF'}</button>
                                    </div>
                                    <div ref={chatScrollRef} className="flex-1 overflow-y-auto custom-scrollbar px-4 lg:px-8 py-5 space-y-4 max-w-3xl w-full mx-auto">
                                        {chatSearch.trim() && <div className="text-[9px] font-mono text-ember-600">SEARCH: {filteredMessages.length} match(es) in this chat</div>}
                                        {filteredMessages.map(renderMessage)}
                                        {busy && (
                                            <div className="flex items-center gap-2 text-[10px] font-mono text-stone-500 animate-pulseDot">
                                                <span className="w-1.5 h-1.5 rounded-full bg-ember-500"></span>
                                                {brainConfigured() ? 'NEXUS IS THINKING' : 'PIPELINE RUNNING IN BACKGROUND'} · {providerTag}
                                            </div>
                                        )}
                                        {!busy && (
                                            <div className="flex flex-wrap gap-2 pt-2">
                                                {QUICK_TASKS.map(t => (
                                                    <button key={t} onClick={() => setChatInput(t)} className="text-[10px] font-mono border border-cream-400 bg-white text-stone-500 hover:text-ember-600 hover:border-ember-300 px-3.5 py-2 rounded-full transition-all">{t}</button>
                                                ))}
                                                <button onClick={() => setChatInput('')} className="text-[10px] font-mono border border-ember-300 bg-ember-50 text-ember-700 hover:bg-ember-100 px-3.5 py-2 rounded-full transition-all" title="Load a skill pack"
                                                    onMouseDown={e => { e.preventDefault(); const pack = window.prompt('Load skill pack:\n' + Object.keys(SKILL_PACKS).map(k => ' - ' + k + ' (' + SKILL_PACKS[k].title + ')').join('\n')); if (pack && SKILL_PACKS[pack.trim().toLowerCase()]) { setChats(prev => prev.map(c => c.id === activeChatId ? { ...c, memory: { ...(c.memory || {}), skills: Array.from(new Set([...(c.memory && c.memory.skills ? c.memory.skills : []), pack.trim().toLowerCase()])) } } : c)); pushMessage({ id: uid(), kind: 'card', title: 'SKILL LOADED · ' + SKILL_PACKS[pack.trim().toLowerCase()].title.toUpperCase(), tone: 'ok', lines: [SKILL_PACKS[pack.trim().toLowerCase()].prompt.slice(0, 120)], ts: stamp() }); } }}>
                                                    + SKILLS
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                    <div id="nexus-composer" className="shrink-0 px-3 lg:px-8 pb-6 lg:pb-8 pt-2 max-w-3xl w-full mx-auto" style={{ paddingBottom: 'calc(1.5rem + env(safe-area-inset-bottom))' }}>
                                        <div className="rounded-2xl border border-cream-300 bg-white shadow-soft">
                                            <form onSubmit={handleSubmit} className="relative flex items-end gap-1 p-2"
                                                onDragOver={e => e.preventDefault()}
                                                onDrop={e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleAttach(e.dataTransfer.files); }}>
                                                <button
                                                    type="button"
                                                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                                    disabled={busy}
                                                    className="w-9 h-9 shrink-0 flex items-center justify-center rounded-lg text-stone-400 hover:text-ember-600 hover:bg-cream-100 transition-all disabled:opacity-40"
                                                    title="Attach file, image or video"
                                                >
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>
                                                </button>
                                                <input ref={fileInputRef} type="file" multiple accept="image/*,video/*,.txt,.md,.json,.js,.py,.html,.css,.csv,.log" className="hidden" onChange={e => { handleAttach(e.target.files); e.target.value = ''; }} />
                                                <textarea
                                                    rows="1"
                                                    value={chatInput}
                                                    onChange={e => { setChatInput(e.target.value); e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; }}
                                                    onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.form && e.target.form.requestSubmit(); } }}
                                                    onPaste={e => { const files = e.clipboardData && e.clipboardData.files; if (files && files.length) { e.preventDefault(); handleAttach(files); } }}
                                                    onFocus={() => { const c = document.getElementById('nexus-composer'); if (c) setTimeout(() => c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 120); }}
                                                    placeholder="Message Nexus..."
                                                    disabled={busy}
                                                    className={'flex-1 min-w-0 bg-transparent text-[14px] rounded-xl px-2 py-2.5 resize-none focus:outline-none placeholder:text-stone-400 disabled:opacity-60'}
                                                />
                                                <button
                                                    type="button"
                                                    title="Voice input"
                                                    onClick={() => {
                                                        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                                                        if (!SR) { return; }
                                                        try {
                                                            const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true;
                                                            rec.onresult = (ev) => { let t = ''; for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript; setChatInput(t); };
                                                            rec.onerror = () => {}; rec.start();
                                                        } catch (e) {}
                                                    }}
                                                    className="w-9 h-9 shrink-0 flex items-center justify-center rounded-lg text-stone-400 hover:text-ember-600 hover:bg-cream-100 transition-all"
                                                >
                                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" strokeWidth="1.8"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
                                                </button>
                                                <button
                                                    type="submit"
                                                    disabled={busy || (!chatInput.trim() && !attachments.length)}
                                                    className={'w-10 h-10 shrink-0 flex items-center justify-center rounded-xl transition-all ' + (busy || (!chatInput.trim() && !attachments.length) ? 'text-stone-300 bg-cream-100' : 'text-white btn-primary shadow-soft')}
                                                >
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></svg>
                                                </button>
                                            </form>
                                            {(attachments.length > 0) && (
                                                <div className="flex flex-wrap gap-1.5 px-3 pb-2">
                                                    {attachments.map(a => (
                                                        <span key={a.id} className="inline-flex items-center gap-1.5 text-[9px] font-mono border border-cream-300 bg-cream-50 rounded-lg px-2 py-1 text-stone-500">
                                                            {a.kind === 'image' ? <img src={a.dataUrl} alt="" className="h-5 w-5 rounded object-cover" /> : a.kind === 'video' ? <svg width="10" height="10" viewBox="0 0 24 24" fill="none" className="text-stone-400"><path d="M23 7l-7 5 7 5V7z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><rect x="1" y="5" width="15" height="14" rx="2" stroke="currentColor" strokeWidth="1.8"/></svg> : <svg width="10" height="10" viewBox="0 0 24 24" fill="none" className="text-stone-400"><path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>}
                                                            {a.name}
                                                            <button type="button" onClick={() => setAttachments(prev => prev.filter(x => x.id !== a.id))} className="text-stone-400 hover:text-ember-600">×</button>
                                                        </span>
                                                    ))}
                                                </div>
                                            )}
                                            {busy && (
                                                <div className="flex items-center gap-2 px-3 pb-2">
                                                    <button onClick={stopAgent} className="text-[9px] font-mono border border-red-200 bg-red-50 text-red-500 hover:bg-red-100 px-2.5 py-1 rounded-lg transition-all">■ STOP</button>
                                                    <span className="text-[9px] font-mono text-stone-400">working... you can stop anytime</span>
                                                </div>
                                            )}
                                            {!busy && lastUserTextRef.current && (
                                                <div className="flex items-center gap-2 px-3 pb-2">
                                                    <button onClick={retryLast} className="text-[9px] font-mono border border-cream-400 bg-white text-stone-500 hover:text-ember-600 px-2.5 py-1 rounded-lg transition-all">↻ RETRY LAST</button>
                                                </div>
                                            )}
                                        </div>

                                        <div>
                                            <div className="text-[9px] font-mono text-stone-400 mb-1.5 tracking-wider">DIRECTIVE</div>
                                            <textarea value={remoteDirective} onChange={e => setRemoteDirective(e.target.value)} rows="2" placeholder="Optional - leave blank to skip" className="w-full bg-cream-50 border border-cream-400 text-[12px] rounded-xl px-3.5 py-3 focus:outline-none focus:border-ember-400 transition-all placeholder:text-stone-400 resize-none"></textarea>
                                        </div>
                                        <div className="flex items-center gap-3 flex-wrap">
                                            <button onClick={handleRemoteDispatch} disabled={remoteBusy || !remoteToken.trim()} className="text-[10px] font-mono btn-primary text-white px-4 py-2.5 rounded-xl tracking-wider transition-all shadow-soft disabled:opacity-40">
                                                {remoteBusy ? 'ENGAGED...' : 'DISPATCH'}
                                            </button>
                                            <span className="text-[10px] font-mono text-stone-400">{REPO}</span>
                                        </div>
                                        {remoteStatus && <div className={'text-[10px] font-mono px-3 py-2 rounded-xl border ' + (remoteStatus.startsWith('ERROR') ? 'border-red-200 bg-red-50 text-red-500' : 'border-ember-200 bg-ember-50 text-ember-600')}>{remoteStatus}</div>}
                                        <div className="flex gap-4 text-[9px] font-mono text-stone-400 pt-1">
                                            <a href={ACTIONS_URL} target="_blank" rel="noopener noreferrer" className="hover:text-ember-600">RUN LOG</a>
                                            <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener noreferrer" className="hover:text-ember-600">CREATE TOKEN</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
